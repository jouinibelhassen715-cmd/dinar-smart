<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082C60">
<title>Dinar Smart</title>
<style>
:root{
  --navy:#082C60;--blue:#1677C8;--sky:#eaf4ff;--bg:#f3f6fb;
  --white:#fff;--ink:#17263c;--muted:#6d7888;--green:#09845a;
  --red:#c43b50;--amber:#a96000;--line:#e1e8f0;
  --shadow:0 10px 28px rgba(8,44,96,.09);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{background:var(--navy);color:white;padding:18px 5vw 76px;border-radius:0 0 30px 30px}
.topbar,.brand,.actions,.between{display:flex;align-items:center}
.topbar,.between{justify-content:space-between;gap:12px}
.brand{gap:11px;font-size:1.35rem;font-weight:800}
.brand b{color:#55b7ff}
.brand-mark{width:45px;height:45px;border:2px solid #a9d7ff;border-radius:50%;display:grid;place-items:center;font-size:1.3rem}
.top-title{margin:30px 0 14px;font-size:clamp(1.3rem,4vw,2rem)}
.shell{width:min(1160px,94vw);margin:-48px auto 45px}
.panel,.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.panel{padding:20px;margin-bottom:18px}
.grid{display:grid;gap:15px}
.stats{grid-template-columns:repeat(3,1fr);margin:18px 0}
.stat{padding:20px;min-height:126px}
.stat h3{color:var(--muted);font-size:.94rem;font-weight:600;margin:0 0 13px}
.amount{font-size:clamp(1.25rem,3.8vw,1.9rem);font-weight:800;direction:ltr;text-align:start}
.income{color:var(--green)}.expense{color:var(--red)}.balance{color:var(--navy)}
.two-col{grid-template-columns:1.15fr .85fr}
h2{font-size:1.2rem;margin:0 0 15px}h3{margin-top:0}
.muted{color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}
.nav-btn,.lang-btn,.mode-btn{border:0;border-radius:11px;padding:10px 14px}
.nav-btn{color:var(--muted);background:white;border:1px solid var(--line)}
.nav-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.lang-switch{display:flex;gap:5px}
.lang-btn{border:1px solid #ffffff55;background:transparent;color:white}
.lang-btn.active{background:white;color:var(--navy)}
.mode-switch{display:flex;gap:4px;background:#e8eef7;padding:4px;border-radius:13px;max-width:360px}
.mode-btn{flex:1;color:var(--muted);background:transparent}
.mode-btn.active{background:var(--navy);color:white}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:white;font-weight:700}
.btn.primary{background:var(--navy)}.btn.light{background:var(--sky);color:var(--navy)}
.btn.danger{background:var(--red)}.btn.small{padding:7px 10px;font-size:.86rem}
button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1677c855;outline-offset:2px}
.alert{padding:14px 16px;border-radius:13px;margin:12px 0}
.alert.warn{background:#fff5df;border:1px solid #f0d495;color:#704600}
.alert.danger{background:#fff0f2;border:1px solid #edc2c9;color:#8a2433}
.bar-bg{height:11px;background:#e9eef5;border-radius:99px;overflow:hidden}
.bar{height:100%;border-radius:99px;background:var(--blue);transition:width .2s}
.bar.over{background:var(--red)}
.category-row{margin:13px 0}.category-row small{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{margin-bottom:12px}
label{display:block;font-size:.9rem;font-weight:650;margin-bottom:6px}
input,select{width:100%;min-height:45px;padding:10px 12px;border:1px solid #ccd5e1;border-radius:11px;background:white;color:var(--ink)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;background:#eef3fa;border-radius:99px;padding:4px 9px;font-size:.82rem}
.goal{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.goal h3{margin:0;font-size:1rem}
.goal-meta{color:var(--muted);font-size:.9rem;margin:8px 0}
.empty{text-align:center;padding:22px;color:var(--muted)}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top right,#1677c81c,transparent 38%),var(--bg)}
.auth-card{width:min(440px,100%);padding:28px;border-radius:22px;box-shadow:0 18px 50px #082c601f}
.auth-brand{justify-content:center;color:var(--navy);margin-bottom:20px}
.auth-card input{min-height:48px;background:#fbfdff}
.auth-card .btn{min-height:48px}
.password-wrap{position:relative}
.password-wrap input{padding-inline-end:52px}
.password-eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#53657b;display:grid;place-items:center}
.password-eye:hover{background:var(--sky);color:var(--blue)}
.password-eye svg{width:22px;height:22px}
.login-language{display:flex;justify-content:center;gap:4px;width:max-content;margin:16px auto 0;padding:4px;border-radius:13px;background:#edf2f8}
.login-language .lang-btn{min-width:110px;color:var(--navy);border:0}
.login-language .lang-btn.active{color:white;background:var(--navy)}
.link-btn{border:0;background:transparent;color:var(--blue);text-decoration:underline;padding:8px 0}
.footer-note{font-size:.82rem;line-height:1.6;color:var(--muted);margin-top:14px}
.overlay{position:fixed;inset:0;z-index:5;background:#061a35aa;display:grid;place-items:center;padding:16px}
.dialog{width:min(500px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:21px}
.recovery-key{direction:ltr;text-align:center;word-break:break-all;background:#eef4fb;padding:14px;border-radius:11px;font:700 1.15rem monospace}
@media(max-width:760px){.stats,.two-col{grid-template-columns:1fr}.stat{min-height:auto}.top{padding:15px 4vw 70px}.panel{padding:16px}}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.brand{font-size:1.12rem}.brand-mark{width:40px;height:40px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.nav-btn{text-align:center}.auth-card{padding:23px 18px}.login-language{width:100%}.login-language .lang-btn{flex:1}}
</style>
</head>
<body>

<section id="loginScreen" class="auth-wrap">
  <div class="panel auth-card">
    <div class="brand auth-brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
    <h2 data-i="loginTitle"></h2>
    <p class="muted" data-i="loginSubtitle"></p>
    <form id="loginForm">
      <div class="field"><label for="loginEmail" data-i="email"></label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field">
        <label for="loginPassword" data-i="password"></label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button class="password-eye" type="button" data-eye="loginPassword"></button>
        </div>
      </div>
      <button class="btn primary" type="submit" style="width:100%" data-i="login"></button>
    </form>
    <button id="openRecovery" class="link-btn" type="button" data-i="forgot"></button>
    <div class="login-language">
      <button class="lang-btn" type="button" data-lang="fr">Français</button>
      <button class="lang-btn" type="button" data-lang="ar">عربي</button>
    </div>
    <p class="footer-note" data-i="initialHint"></p>
    <p class="footer-note" data-i="localNotice"></p>
  </div>
</section>

<section id="changeScreen" class="auth-wrap" hidden>
  <div class="panel auth-card">
    <div class="brand auth-brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
    <h2 data-i="changeTitle"></h2><p class="muted" data-i="changeHint"></p>
    <form id="changeForm">
      <div class="field">
        <label for="newPassword" data-i="newPassword"></label>
        <div class="password-wrap">
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
          <button class="password-eye" type="button" data-eye="newPassword"></button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword" data-i="confirmPassword"></label>
        <div class="password-wrap">
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
          <button class="password-eye" type="button" data-eye="confirmPassword"></button>
        </div>
      </div>
      <button class="btn primary" type="submit" style="width:100%" data-i="savePassword"></button>
      <div class="login-language">
        <button class="lang-btn" type="button" data-lang="fr">Français</button>
        <button class="lang-btn" type="button" data-lang="ar">عربي</button>
      </div>
    </form>
  </div>
</section>

<div id="appScreen" hidden>
  <header class="top">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
      <div class="actions">
        <div class="lang-switch">
          <button class="lang-btn" type="button" data-lang="fr">Français</button>
          <button class="lang-btn" type="button" data-lang="ar">عربي</button>
        </div>
        <button id="logout" class="lang-btn" type="button" data-i="logout"></button>
      </div>
    </div>
    <h1 class="top-title" data-i="dashboardTitle"></h1>
    <div class="mode-switch">
      <button class="mode-btn active" type="button" data-mode="employee" data-i="employee"></button>
      <button class="mode-btn" type="button" data-mode="artisan" data-i="artisan"></button>
    </div>
  </header>

  <main class="shell">
    <nav class="nav">
      <button class="nav-btn active" data-page="dashboard" data-i="navDashboard"></button>
      <button class="nav-btn" data-page="transactions" data-i="navTransactions"></button>
      <button class="nav-btn" data-page="budget" data-i="navBudget"></button>
      <button class="nav-btn" data-page="goals" data-i="navGoals"></button>
    </nav>

    <section id="page-dashboard">
      <div id="alerts"></div>
      <div class="grid stats">
        <article class="card stat"><h3 data-i="totalIncome"></h3><div id="totalIncome" class="amount income"></div></article>
        <article class="card stat"><h3 data-i="totalExpense"></h3><div id="totalExpense" class="amount expense"></div></article>
        <article class="card stat"><h3 data-i="balance"></h3><div id="balance" class="amount balance"></div><small id="balancePercent" class="muted"></small></article>
      </div>

      <section id="artisanSummary" class="panel" hidden>
        <h2 data-i="artisanSummary"></h2>
        <div class="grid stats">
          <article class="card stat"><h3 data-i="serviceIncome"></h3><div id="serviceIncome" class="amount income"></div></article>
          <article class="card stat"><h3 data-i="professionalExpense"></h3><div id="professionalExpense" class="amount expense"></div></article>
          <article class="card stat"><h3 data-i="estimatedProfit"></h3><div id="profit" class="amount balance"></div></article>
        </div>
      </section>

      <div class="grid two-col">
        <section class="panel">
          <div class="between"><h2 data-i="monthlyBudget"></h2><span id="monthLabel" class="muted"></span></div>
          <div id="budgetSummary"></div>
          <div class="bar-bg"><div id="budgetBar" class="bar" style="width:0%"></div></div>
          <p id="budgetNumbers" class="muted"></p>
          <button class="btn light" data-go="budget" data-i="manageBudget"></button>
        </section>
        <section class="panel"><h2 data-i="expenseByCategory"></h2><div id="categoryChart"></div></section>
      </div>

      <section class="panel">
        <div class="between"><h2 data-i="recentTransactions"></h2><button class="btn small" data-go="transactions" data-i="viewAll"></button></div>
        <div id="recentList"></div>
      </section>
    </section>

    <section id="page-transactions" hidden>
      <section class="panel">
        <div class="between">
          <h2 data-i="transactionsTitle"></h2>
          <div class="actions">
            <button id="exportCsv" class="btn light" data-i="exportCsv"></button>
            <button id="addTransaction" class="btn" data-i="addTransaction"></button>
          </div>
        </div>
        <div class="form-grid">
          <div class="field"><label for="filterMonth" data-i="filterMonth"></label><input id="filterMonth" type="month"></div>
          <div class="field"><label for="filterCategory" data-i="category"></label><select id="filterCategory"></select></div>
        </div>
        <div id="transactionList"></div>
      </section>
    </section>

    <section id="page-budget" hidden>
      <section class="panel">
        <h2 data-i="budgetPageTitle"></h2><p class="muted" data-i="budgetHint"></p>
        <form id="budgetForm">
          <div class="form-grid">
            <div class="field"><label for="budgetMonth" data-i="month"></label><input id="budgetMonth" type="month" required></div>
            <div class="field"><label for="budgetAmount" data-i="budgetAmount"></label><input id="budgetAmount" type="number" min="0" step="0.01" required></div>
          </div>
          <button class="btn primary" type="submit" data-i="saveBudget"></button>
        </form>
        <div id="budgetDetail" style="margin-top:20px"></div>
      </section>
    </section>

    <section id="page-goals" hidden>
      <section class="panel">
        <h2 data-i="goalsTitle"></h2>
        <form id="goalForm">
          <div class="form-grid">
            <div class="field"><label for="goalName" data-i="goalName"></label><input id="goalName" maxlength="60" required></div>
            <div class="field"><label for="goalTarget" data-i="goalTarget"></label><input id="goalTarget" type="number" min="0.01" step="0.01" required></div>
            <div class="field"><label for="goalSaved" data-i="goalSaved"></label><input id="goalSaved" type="number" min="0" step="0.01" value="0"></div>
          </div>
          <button class="btn primary" type="submit" data-i="addGoal"></button>
        </form>
        <div id="goalList" style="margin-top:20px"></div>
      </section>
    </section>
  </main>
</div>

<div id="transactionDialog" class="overlay" hidden>
  <div class="dialog">
    <div class="between"><h2 id="transactionDialogTitle" data-i="addTransaction"></h2><button class="btn light small" data-close="transactionDialog" data-i="close"></button></div>
    <form id="transactionForm">
      <input id="transactionId" type="hidden"><input id="transactionMode" type="hidden">
      <div class="form-grid">
        <div class="field"><label for="txType" data-i="type"></label><select id="txType"><option value="income" data-i="income"></option><option value="expense" data-i="expense"></option></select></div>
        <div class="field"><label for="txAmount" data-i="amount"></label><input id="txAmount" type="number" min="0.01" step="0.01" required></div>
        <div class="field"><label for="txCategory" data-i="category"></label><select id="txCategory" required></select></div>
        <div class="field"><label for="txDate" data-i="date"></label><input id="txDate" type="date" required></div>
      </div>
      <div class="field"><label for="txNote" data-i="description"></label><input id="txNote" maxlength="120"></div>
      <button class="btn primary" type="submit" data-i="save"></button>
    </form>
  </div>
</div>

<div id="recoveryDialog" class="overlay" hidden>
  <div class="dialog">
    <div class="between"><h2 data-i="forgot"></h2><button class="btn light small" data-close="recoveryDialog" data-i="close"></button></div>
    <p class="muted" data-i="recoveryHint"></p>
    <form id="recoveryForm">
      <div class="field"><label for="recoveryEmail" data-i="email"></label><input id="recoveryEmail" type="email" required></div>
      <div class="field"><label for="recoveryKey" data-i="recoveryKey"></label><input id="recoveryKey" required autocomplete="off"></div>
      <div class="field">
        <label for="recoveryNewPassword" data-i="newPassword"></label>
        <div class="password-wrap">
          <input id="recoveryNewPassword" type="password" minlength="8" required autocomplete="new-password">
          <button class="password-eye" type="button" data-eye="recoveryNewPassword"></button>
        </div>
      </div>
      <button class="btn primary" type="submit" data-i="resetPassword"></button>
    </form>
  </div>
</div>

<div id="keyDialog" class="overlay" hidden>
  <div class="dialog center">
    <h2 data-i="saveRecoveryKey"></h2><p class="muted" data-i="keyOneTime"></p>
    <div id="shownKey" class="recovery-key"></div>
    <button id="copyKey" class="btn light" style="margin:12px" data-i="copyKey"></button>
    <button id="closeKeyDialog" class="btn primary" data-i="understood"></button>
  </div>
</div>

BusinessTransport:"Transport professionnel",Fees:"Frais professionnels",OtherExpense:"Autre dépense"}

let lang=localStorage.getItem("dinar-smart-lang")||"ar";
let account=null,data={transactions:[],goals:[],budgets:{}},mode="employee";
const t=k=>words[lang][k]||k;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const thisMonth=()=>today().slice(0,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat(lang==="ar"?"ar-TN":"fr-TN",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+" TND";
const dataKey=email=>DATA_PREFIX+encodeURIComponent(email.toLowerCase());

function eyeSvg(open){
 return open
 ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c5 0 8.3 4.2 9 7a10.8 10.8 0 0 1-2.1 3.8"/><path d="M6.2 6.2C4.5 7.3 3.4 9 3 12c.7 2.8 4 7 9 7 1.2 0 2.3-.2 3.3-.7"/></svg>`
 : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.3-7 9.5-7 9.5 7 9.5 7-3.3 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
}
function syncEyes(){
 document.querySelectorAll("[data-eye]").forEach(btn=>{
  const input=$(btn.dataset.eye),open=input.type==="text";
  btn.innerHTML=eyeSvg(open);
  btn.setAttribute("aria-label",t(open?"hide":"show"));
  btn.title=t(open?"hide":"show");
 });
}
function translate(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
 document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 syncEyes();
 if(!$("#appScreen").hidden)render();
}
function setLanguage(next){lang=next;localStorage.setItem("dinar-smart-lang",lang);translate()}
function randomHex(bytes=16){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return [...a].map(v=>v.toString(16).padStart(2,"0")).join("")}
async function hashPassword(password,saltHex){
 if(!crypto?.subtle)throw new Error("CRYPTO");
 const salt=Uint8Array.from(saltHex.match(/.{1,2}/g).map(x=>parseInt(x,16)));
 const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},key,256);
 return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function makeAccount(){
 account=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"null");
 if(!account){
  const salt=randomHex();
  account={email:ADMIN_EMAIL,salt,hash:await hashPassword(INITIAL_PASSWORD,salt),mustChange:true,recoverySalt:"",recoveryHash:""};
  saveAccount();
 }
 $("#loginEmail").value=account.email;
}
function saveAccount(){localStorage.setItem(ACCOUNT_KEY,JSON.stringify(account))}
function saveData(){localStorage.setItem(dataKey(account.email),JSON.stringify(data))}
function loadData(){
 try{data=JSON.parse(localStorage.getItem(dataKey(account.email))||"null")||{transactions:[],goals:[],budgets:{}}}
 catch{data={transactions:[],goals:[],budgets:{}}}
 if(!Array.isArray(data.transactions))data.transactions=[];
 if(!Array.isArray(data.goals))data.goals=[];
 if(!data.budgets||typeof data.budgets!=="object")data.budgets={};
}
function showScreen(id){["loginScreen","changeScreen","appScreen"].forEach(x=>$(x).hidden=x!==id)}
function openDialog(id){$(id).hidden=false}
function closeDialog(id){$(id).hidden=true}
function newRecoveryKey(){return randomHex(12).toUpperCase().match(/.{1,4}/g).join("-")}
async function setPassword(password){
 const salt=randomHex(),recovery=newRecoveryKey(),recoverySalt=randomHex();
 account.salt=salt;account.hash=await hashPassword(password,salt);account.mustChange=false;
 account.recoverySalt=recoverySalt;account.recoveryHash=await hashPassword(recovery,recoverySalt);saveAccount();
 return recovery;
}
function showKey(key){$("#shownKey").textContent=key;openDialog("keyDialog")}
function beginApp(){
 loadData();$("#filterMonth").value=thisMonth();$("#budgetMonth").value=thisMonth();
 showScreen("appScreen");render();
}
function categoryLabel(code){return categoryNames[lang][code]||code||"—"}
function categoryList(type,selectedMode=mode){
 if(type==="income")return ["Salary","Services","OtherIncome"];
 return selectedMode==="artisan"
  ? ["Materials","Tools","BusinessTransport","Fees","OtherExpense"]
  : ["Food","Housing","Transport","Health","Shopping","Education","Leisure","OtherExpense"];
}
function fillCategories(select,all=false){
 const prior=select.value;
 const list=[...new Set([...categoryList("income","employee"),...categoryList("expense","employee"),...categoryList("expense","artisan")])];
 select.innerHTML=(all?`<option value="">${esc(t("allCategories"))}</option>`:"")+list.map(c=>`<option value="${esc(c)}">${esc(categoryLabel(c))}</option>`).join("");
 if([...select.options].some(o=>o.value===prior))select.value=prior;
}
function updateTxCategories(){
 const prior=$("#txCategory").value,list=categoryList($("#txType").value,$("#transactionMode").value||mode);
 $("#txCategory").innerHTML=list.map(c=>`<option value="${esc(c)}">${esc(categoryLabel(c))}</option>`).join("");
 if([...$("#txCategory").options].some(o=>o.value===prior))$("#txCategory").value=prior;
}
function monthTransactions(month){return data.transactions.filter(x=>(x.date||"").slice(0,7)===month)}
function sum(list,type){return list.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount||0),0)}
function render(){
 fillCategories($("#filterCategory"),true);
 const incomes=sum(data.transactions,"income"),expenses=sum(data.transactions,"expense"),balance=incomes-expenses,month=thisMonth();
 $("#totalIncome").textContent=money(incomes);$("#totalExpense").textContent=money(expenses);$("#balance").textContent=money(balance);
 $("#balancePercent").textContent=incomes?`${Math.max(0,Math.round(balance/incomes*100))}% ${t("remaining")}`:"";
 $("#monthLabel").textContent=new Intl.DateTimeFormat(lang==="ar"?"ar-TN":"fr-TN",{month:"long",year:"numeric"}).format(new Date(month+"-01T12:00:00"));
 const budget=Number(data.budgets[month]||0),spent=sum(monthTransactions(month),"expense"),ratio=budget?spent/budget*100:0;
 $("#budgetBar").style.width=Math.min(100,ratio)+"%";$("#budgetBar").classList.toggle("over",spent>budget);
 $("#budgetNumbers").textContent=budget?`${t("used")}: ${money(spent)} / ${money(budget)} (${Math.round(ratio)}%)`:t("noBudgetYet");
 $("#budgetSummary").innerHTML=budget?`<p>${esc(t("used"))}: <b>${esc(money(spent))}</b> ${esc(t("ofBudget"))} ${esc(money(budget))}</p>`:`<p class="muted">${esc(t("noBudget"))}</p>`;
 $("#alerts").innerHTML=budget&&spent>budget?`<div class="alert danger">${esc(t("budgetExceeded"))}</div>`:budget&&ratio>=80?`<div class="alert warn">${esc(t("spent80"))}</div>`:"";
 $("#artisanSummary").hidden=mode!=="artisan";
 if(mode==="artisan"){
  const business=data.transactions.filter(x=>x.mode==="artisan"),si=sum(business,"income"),pe=sum(business,"expense");
  $("#serviceIncome").textContent=money(si);$("#professionalExpense").textContent=money(pe);$("#profit").textContent=money(si-pe);
 }
 const groups={};data.transactions.filter(x=>x.type==="expense").forEach(x=>groups[x.category]=(groups[x.category]||0)+Number(x.amount||0));
 const entries=Object.entries(groups).sort((a,b)=>b[1]-a[1]),max=entries[0]?.[1]||1;
 $("#categoryChart").innerHTML=entries.length?entries.slice(0,8).map(([c,v])=>`<div class="category-row"><div class="between"><span>${esc(categoryLabel(c))}</span><small>${esc(money(v))}</small></div><div class="bar-bg"><div class="bar" style="width:${Math.max(4,v/max*100)}%"></div></div></div>`).join(""):`<div class="empty">${esc(t("noTransactions"))}</div>`;
 renderTransactions();renderBudget();renderGoals();translateStaticOnly();
}
function translateStaticOnly(){
 document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
 document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 syncEyes();
}
function txRow(x,actions=true){
 const label=x.type==="income"?t("income"):t("expense");
 return `<tr><td>${esc(x.date)}</td><td>${esc(x.description||"—")}</td><td><span class="tag">${esc(categoryLabel(x.category))}</span></td><td class="${x.type==="income"?"income":"expense"}">${esc(label)}</td><td>${esc(money(x.amount))}</td>${actions?`<td><div class="actions"><button class="btn light small" data-edit="${esc(x.id)}">${esc(t("edit"))}</button><button class="btn danger small" data-delete-tx="${esc(x.id)}">${esc(t("delete"))}</button></div></td>`:""}</tr>`;
}
function renderTransactions(){
 const recent=[...data.transactions].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,5);
 $("#recentList").innerHTML=recent.length?`<div class="table-wrap"><table><thead><tr><th>${t("date")}</th><th>${t("description")}</th><th>${t("category")}</th><th>${t("type")}</th><th>${t("amount")}</th></tr></thead><tbody>${recent.map(x=>txRow(x,false)).join("")}</tbody></table></div>`:`<div class="empty">${t("noTransactions")}</div>`;
 const month=$("#filterMonth").value,cat=$("#filterCategory").value;
 const list=[...data.transactions].filter(x=>(!month||(x.date||"").slice(0,7)===month)&&(!cat||x.category===cat)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 $("#transactionList").innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>${t("date")}</th><th>${t("description")}</th><th>${t("category")}</th><th>${t("type")}</th><th>${t("amount")}</th><th></th></tr></thead><tbody>${list.map(x=>txRow(x,true)).join("")}</tbody></table></div>`:`<div class="empty">${t("noTransactions")}</div>`;
}
function renderBudget(){
 const month=$("#budgetMonth").value||thisMonth(),budget=Number(data.budgets[month]||0),spent=sum(monthTransactions(month),"expense"),pct=budget?Math.round(spent/budget*100):0;
 $("#budgetDetail").innerHTML=budget?`<h3>${esc(month)} — ${esc(money(budget))}</h3><p>${esc(t("used"))}: ${esc(money(spent))} (${pct}%)</p><div class="bar-bg"><div class="bar ${spent>budget?"over":""}" style="width:${Math.min(100,pct)}%"></div></div>`:`<div class="empty">${esc(t("noBudget"))}</div>`;
}
function renderGoals(){
 $("#goalList").innerHTML=data.goals.length?data.goals.map(g=>{
  const target=Number(g.target)||0,saved=Number(g.saved)||0,pct=target?Math.min(100,Math.round(saved/target*100)):0;
  return `<article class="goal"><div class="between"><h3>${esc(g.name)}</h3><button class="btn danger small" data-delete-goal="${esc(g.id)}">${esc(t("delete"))}</button></div><div class="goal-meta">${esc(t("saved"))}: ${esc(money(saved))} · ${esc(t("target"))}: ${esc(money(target))} · ${esc(t("goalProgress"))}: ${pct}%</div><div class="bar-bg"><div class="bar" style="width:${pct}%"></div></div><div class="actions" style="margin-top:10px"><input id="add-${esc(g.id)}" type="number" min=".01" step=".01" placeholder="${esc(t("amount"))}" style="max-width:180px"><button class="btn light small" data-contribute="${esc(g.id)}">${esc(t("addSaving"))}</button></div></article>`;
 }).join(""):`<div class="empty">${esc(t("noGoals"))}</div>`;
}
function setPage(page){
 document.querySelectorAll("[id^=page-]").forEach(el=>el.hidden=el.id!=="page-"+page);
 document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(page==="transactions")renderTransactions();if(page==="budget")renderBudget();
}
function openTransaction(tx){
 $("#transactionForm").reset();$("#transactionId").value=tx?.id||"";
 $("#transactionMode").value=tx?.mode||mode;$("#txType").value=tx?.type||"expense";
 $("#txAmount").value=tx?.amount||"";$("#txDate").value=tx?.date||today();$("#txNote").value=tx?.description||"";
 $("#transactionDialogTitle").textContent=tx?t("edit"):t("addTransaction");
 updateTxCategories();if(tx)$("#txCategory").value=tx.category;
 openDialog("transactionDialog");
}
function downloadCsv(){
 const rows=[[t("date"),t("type"),t("category"),t("description"),t("amount"),"TND"]];
 [...data.transactions].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(x=>rows.push([
  x.date,x.type==="income"?t("income"):t("expense"),categoryLabel(x.category),x.description||"",Number(x.amount).toFixed(2),"TND"
 ]));
 const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`dinar-smart-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);
}

document.addEventListener("click",async e=>{
 const langButton=e.target.closest("[data-lang]");if(langButton)setLanguage(langButton.dataset.lang);
 const eye=e.target.closest("[data-eye]");if(eye){const input=$(eye.dataset.eye);input.type=input.type==="password"?"text":"password";syncEyes()}
 const modeButton=e.target.closest("[data-mode]");if(modeButton){mode=modeButton.dataset.mode;document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b===modeButton));render()}
 const page=e.target.closest("[data-page]");if(page)setPage(page.dataset.page);
 const go=e.target.closest("[data-go]");if(go)setPage(go.dataset.go);
 const close=e.target.closest("[data-close]");if(close)closeDialog(close.dataset.close);
 const edit=e.target.closest("[data-edit]");if(edit)openTransaction(data.transactions.find(x=>x.id===edit.dataset.edit));
 const del=e.target.closest("[data-delete-tx]");if(del&&confirm(t("confirmDelete"))){data.transactions=data.transactions.filter(x=>x.id!==del.dataset.deleteTx);saveData();render()}
 const delGoal=e.target.closest("[data-delete-goal]");if(delGoal&&confirm(t("confirmGoalDelete"))){data.goals=data.goals.filter(x=>x.id!==delGoal.dataset.deleteGoal);saveData();render()}
 const add=e.target.closest("[data-contribute]");if(add){const goal=data.goals.find(x=>x.id===add.dataset.contribute),input=$("add-"+add.dataset.contribute),amount=Number(input.value);if(goal&&amount>0){goal.saved=Number(goal.saved||0)+amount;saveData();render()}}
});

$("#loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 try{
  if($("#loginEmail").value.trim().toLowerCase()!==account.email.toLowerCase())return alert(t("emailMismatch"));
  if(await hashPassword($("#loginPassword").value,account.salt)!==account.hash)return alert(t("invalidLogin"));
  if(account.mustChange)showScreen("changeScreen");else beginApp();
 }catch{alert(t("cryptoError"))}
});
$("#changeForm").addEventListener("submit",async e=>{
 e.preventDefault();const p=$("#newPassword").value;
 if(p.length<8)return alert(t("minPassword"));if(p!==$("#confirmPassword").value)return alert(t("passwordsMismatch"));
 try{const key=await setPassword(p);$("#changeForm").reset();showKey(key)}catch{alert(t("cryptoError"))}
});
$("#openRecovery").addEventListener("click",()=>openDialog("recoveryDialog"));
$("#recoveryForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const email=$("#recoveryEmail").value.trim().toLowerCase(),key=$("#recoveryKey").value.trim().toUpperCase(),p=$("#recoveryNewPassword").value;
 if(p.length<8)return alert(t("minPassword"));
 if(email!==account.email.toLowerCase())return alert(t("resetFailed"));
 try{
  let valid=false;
  if(account.recoveryHash&&account.recoverySalt)valid=await hashPassword(key,account.recoverySalt)===account.recoveryHash;
  else if(account.mustChange)valid=await hashPassword(key,account.salt)===account.hash;
  if(!valid)return alert(t("resetFailed"));
  const newKey=await setPassword(p);$("#recoveryForm").reset();closeDialog("recoveryDialog");showKey(newKey);
 }catch{alert(t("cryptoError"))}
});
$("#closeKeyDialog").addEventListener("click",()=>{closeDialog("keyDialog");beginApp()});
$("#copyKey").addEventListener("click",async()=>{
 try{await navigator.clipboard.writeText($("#shownKey").textContent);alert(t("recoveryKeyCopied"))}
 catch{prompt(t("copyKey"),$("#shownKey").textContent)}
});
$("#logout").addEventListener("click",()=>{$("#loginPassword").value="";showScreen("loginScreen")});
$("#addTransaction").addEventListener("click",()=>openTransaction(null));
$("#txType").addEventListener("change",updateTxCategories);
$("#filterMonth").addEventListener("change",renderTransactions);
$("#filterCategory").addEventListener("change",renderTransactions);
$("#exportCsv").addEventListener("click",downloadCsv);
$("#transactionForm").addEventListener("submit",e=>{
 e.preventDefault();const amount=Number($("#txAmount").value);if(!(amount>0))return alert(t("invalidAmount"));
 const id=$("#transactionId").value||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
 const tx={id,type:$("#txType").value,amount,category:$("#txCategory").value,date:$("#txDate").value,description:$("#txNote").value.trim(),mode:$("#transactionMode").value||mode};
 const i=data.transactions.findIndex(x=>x.id===id);if(i<0)data.transactions.push(tx);else data.transactions[i]=tx;
 saveData();closeDialog("transactionDialog");render();
});
$("#budgetForm").addEventListener("submit",e=>{
 e.preventDefault();const month=$("#budgetMonth").value,amount=Number($("#budgetAmount").value);if(month&&amount>=0){data.budgets[month]=amount;saveData();render()}
});
$("#budgetMonth").addEventListener("change",renderBudget);
$("#goalForm").addEventListener("submit",e=>{
 e.preventDefault();const target=Number($("#goalTarget").value),saved=Number($("#goalSaved").value||0);
 if(!(target>0)||saved<0)return alert(t("invalidAmount"));
 data.goals.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:$("#goalName").value.trim(),target,saved});
 saveData();$("#goalForm").reset();$("#goalSaved").value="0";render();
});

fillCategories($("#filterCategory"),true);
$("#filterMonth").value=thisMonth();$("#budgetMonth").value=thisMonth();
translate();
makeAccount().catch(()=>alert(t("cryptoError")));
</script>
