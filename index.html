<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082C60">
  <title>Dinar Smart — إدارة مالية ذكية</title>
  <style>
    :root {
      --navy: #082C60;
      --blue: #1677C8;
      --sky: #e8f3ff;
      --bg: #f3f6fb;
      --white: #fff;
      --ink: #18263b;
      --muted: #6d7888;
      --green: #09845a;
      --red: #c43b50;
      --amber: #b66b00;
      --line: #e2e8f0;
      --shadow: 0 8px 24px rgba(8, 44, 96, .08);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .top {
      color: white; background: var(--navy); padding: 18px 5vw 76px;
      border-radius: 0 0 30px 30px;
    }
    .topbar, .brand, .top-actions, .row, .between { display: flex; align-items: center; }
    .topbar, .between { justify-content: space-between; }
    .brand { gap: 12px; font-weight: 800; font-size: 1.4rem; }
    .brand-mark {
      display: grid; place-items: center; border: 2px solid #a9d7ff;
      border-radius: 50%; width: 46px; height: 46px; font-size: 1.35rem;
    }
    .brand span:last-child b { color: #54b5ff; }
    .top-actions { gap: 10px; }
    .top-title { margin: 34px 0 0; font-size: clamp(1.2rem, 4vw, 2rem); }
    .shell { width: min(1160px, 94vw); margin: -48px auto 40px; }
    .panel, .card {
      background: var(--white); border: 1px solid var(--line);
      border-radius: 20px; box-shadow: var(--shadow);
    }
    .panel { padding: 20px; margin-bottom: 18px; }
    .lang-btn, .mode-btn, .nav-btn {
      border: 0; border-radius: 12px; padding: 10px 14px; background: transparent;
    }
    .lang-btn { color: white; border: 1px solid #ffffff55; }
    .lang-btn.active { background: white; color: var(--navy); }
    .mode-switch { display: flex; background: #eaf0f8; padding: 4px; border-radius: 14px; gap: 3px; }
    .mode-btn { color: var(--muted); flex: 1; }
    .mode-btn.active { color: white; background: var(--navy); }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .nav-btn { color: var(--muted); background: white; border: 1px solid var(--line); }
    .nav-btn.active { color: white; background: var(--navy); border-color: var(--navy); }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(3, 1fr); margin: 18px 0; }
    .stat { padding: 22px; min-height: 130px; }
    .stat h3, .subtle { color: var(--muted); font-size: .96rem; margin: 0 0 12px; }
    .amount { font-size: clamp(1.35rem, 4vw, 2rem); font-weight: 800; direction: ltr; text-align: start; }
    .income { color: var(--green); }
    .expense { color: var(--red); }
    .balance { color: var(--navy); }
    .two-col { grid-template-columns: 1.2fr .8fr; }
    h2 { margin: 0 0 16px; font-size: 1.25rem; }
    h3 { margin-top: 0; }
    .alert { border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
    .alert.warn { color: #704600; background: #fff5dc; border: 1px solid #f0d495; }
    .alert.danger { color: #8a2433; background: #fff0f2; border: 1px solid #f0c2ca; }
    .alert.info { color: #234d76; background: #edf6ff; border: 1px solid #cce4ff; }
    .bar-bg { height: 12px; border-radius: 99px; background: #e9eef5; overflow: hidden; }
    .bar { height: 100%; border-radius: inherit; background: var(--blue); transition: width .25s ease; }
    .bar.over { background: var(--red); }
    .category-row { margin: 13px 0; }
    .category-row .between { margin-bottom: 7px; gap: 10px; }
    .category-row small { color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    label { display: block; font-weight: 650; font-size: .9rem; margin-bottom: 6px; }
    input, select {
      width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #ccd5e1;
      border-radius: 11px; color: var(--ink); background: white;
    }
    input:focus, select:focus { outline: 3px solid #1677c822; border-color: var(--blue); }
    .field { margin-bottom: 12px; }
    .btn {
      border: 0; border-radius: 11px; padding: 11px 16px; color: white;
      background: var(--blue); font-weight: 700;
    }
    .btn:hover { filter: brightness(.95); }
    .btn.primary { background: var(--navy); }
    .btn.light { color: var(--navy); background: var(--sky); }
    .btn.danger { background: var(--red); }
    .btn.small { padding: 7px 10px; font-size: .86rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th, td { text-align: start; padding: 12px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: .88rem; }
    .tag { display: inline-block; border-radius: 99px; padding: 4px 9px; font-size: .8rem; background: #eef3fa; }
    .goal { border: 1px solid var(--line); border-radius: 15px; padding: 15px; margin-bottom: 12px; }
    .goal h3 { margin: 0; font-size: 1rem; }
    .goal-meta { color: var(--muted); font-size: .9rem; margin: 8px 0; }
    .muted { color: var(--muted); }
    .center { text-align: center; }
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 18px; }
    .auth-card { width: min(430px, 100%); padding: 26px; }
    .auth-brand { justify-content: center; color: var(--navy); margin-bottom: 22px; }
    .password-wrap { display: flex; gap: 6px; }
    .password-wrap input { flex: 1; }
    .show-pass { border: 1px solid var(--line); background: white; border-radius: 10px; padding: 0 12px; }
    .link-btn { color: var(--blue); background: none; border: 0; padding: 8px 0; text-decoration: underline; }
    .footer-note { font-size: .82rem; color: var(--muted); line-height: 1.6; margin-top: 16px; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: #061a35aa; z-index: 5; }
    .dialog { width: min(500px, 100%); max-height: 90vh; overflow: auto; background: white; padding: 22px; border-radius: 18px; }
    .recovery-key { direction: ltr; text-align: center; padding: 14px; border-radius: 12px; background: #eef4fb; font: 700 1.2rem monospace; word-break: break-all; }
    .empty { text-align: center; padding: 24px; color: var(--muted); }
    @media (max-width: 760px) {
      .stats, .two-col { grid-template-columns: 1fr; }
      .stat { min-height: auto; }
      .top { padding: 14px 4vw 70px; }
      .top-title { margin-top: 24px; }
      .shell { width: 94vw; }
      .panel { padding: 16px; }
    }
    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; gap: 10px; }
      .brand { font-size: 1.14rem; }
      .brand-mark { width: 40px; height: 40px; }
      .lang-btn { padding: 8px 10px; }
      .nav { display: grid; grid-template-columns: repeat(2, 1fr); }
      .nav-btn { text-align: center; }
    }
  </style>
</head>
<body>

  <!-- تسجيل الدخول -->
  <section id="loginScreen" class="auth-wrap">
    <div class="panel auth-card">
      <div class="brand auth-brand">
        <span class="brand-mark">↗</span>
        <span>Dinar <b>Smart</b></span>
      </div>
      <h2 data-t="loginTitle"></h2>
      <p class="muted" data-t="loginSubtitle"></p>
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail" data-t="email"></label>
          <input id="loginEmail" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword" data-t="password"></label>
          <div class="password-wrap">
            <input id="loginPassword" type="password" autocomplete="current-password" required>
            <button class="show-pass" type="button" data-toggle="loginPassword" data-t="show"></button>
          </div>
        </div>
        <button class="btn primary" type="submit" style="width:100%" data-t="login"></button>
      </form>
      <div class="between">
        <button id="openRecovery" class="link-btn" type="button" data-t="forgot"></button>
        <div>
          <button class="lang-btn active" type="button" data-lang="ar">عربي</button>
          <button class="lang-btn" type="button" data-lang="fr">Français</button>
        </div>
      </div>
      <p class="footer-note" data-t="initialHint"></p>
      <p class="footer-note" data-t="localNotice"></p>
    </div>
  </section>

  <!-- تغيير كلمة المرور لأول مرة -->
  <section id="changeScreen" class="auth-wrap" hidden>
    <div class="panel auth-card">
      <div class="brand auth-brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
      <h2 data-t="changeTitle"></h2>
      <p class="muted" data-t="changeHint"></p>
      <form id="changeForm">
        <div class="field">
          <label for="newPassword" data-t="newPassword"></label>
          <div class="password-wrap">
            <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
            <button class="show-pass" type="button" data-toggle="newPassword" data-t="show"></button>
          </div>
        </div>
        <div class="field">
          <label for="confirmPassword" data-t="confirmPassword"></label>
          <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <button class="btn primary" type="submit" style="width:100%" data-t="savePassword"></button>
      </form>
    </div>
  </section>

  <!-- واجهة التطبيق -->
  <div id="appScreen" hidden>
    <header class="top">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark">↗</span>
          <span>Dinar <b>Smart</b></span>
        </div>
        <div class="top-actions">
          <button class="lang-btn active" type="button" data-lang="ar">عربي</button>
          <button class="lang-btn" type="button" data-lang="fr">Français</button>
          <button id="logout" class="lang-btn" type="button" data-t="logout"></button>
        </div>
      </div>
      <h1 class="top-title" data-t="dashboardTitle"></h1>
      <div class="mode-switch" style="max-width:360px;margin-top:18px">
        <button class="mode-btn active" type="button" data-mode="employee" data-t="employee"></button>
        <button class="mode-btn" type="button" data-mode="artisan" data-t="artisan"></button>
      </div>
    </header>

    <main class="shell">
      <nav class="nav">
        <button class="nav-btn active" data-page="dashboard" data-t="navDashboard"></button>
        <button class="nav-btn" data-page="transactions" data-t="navTransactions"></button>
        <button class="nav-btn" data-page="budget" data-t="navBudget"></button>
        <button class="nav-btn" data-page="goals" data-t="navGoals"></button>
      </nav>

      <section id="page-dashboard">
        <div id="alerts"></div>
        <div class="grid stats">
          <article class="card stat">
            <h3 data-t="totalIncome"></h3><div id="totalIncome" class="amount income"></div>
          </article>
          <article class="card stat">
            <h3 data-t="totalExpense"></h3><div id="totalExpense" class="amount expense"></div>
          </article>
          <article class="card stat">
            <h3 data-t="balance"></h3><div id="balance" class="amount balance"></div>
            <small id="balancePercent" class="muted"></small>
          </article>
        </div>

        <section id="artisanSummary" class="panel" hidden>
          <h2 data-t="artisanSummary"></h2>
          <div class="grid stats">
            <article class="card stat"><h3 data-t="serviceIncome"></h3><div id="serviceIncome" class="amount income"></div></article>
            <article class="card stat"><h3 data-t="professionalExpense"></h3><div id="professionalExpense" class="amount expense"></div></article>
            <article class="card stat"><h3 data-t="estimatedProfit"></h3><div id="profit" class="amount balance"></div></article>
          </div>
        </section>

        <div class="grid two-col">
          <section class="panel">
            <div class="between">
              <h2 data-t="monthlyBudget"></h2>
              <span id="monthLabel" class="muted"></span>
            </div>
            <div id="budgetSummary"></div>
            <div class="bar-bg"><div id="budgetBar" class="bar" style="width:0%"></div></div>
            <p class="muted" id="budgetNumbers"></p>
            <button class="btn light" data-go="budget" data-t="manageBudget"></button>
          </section>
          <section class="panel">
            <h2 data-t="expenseByCategory"></h2>
            <div id="categoryChart"></div>
          </section>
        </div>
        <section class="panel">
          <div class="between">
            <h2 data-t="recentTransactions"></h2>
            <button class="btn small" data-go="transactions" data-t="viewAll"></button>
          </div>
          <div id="recentList"></div>
        </section>
      </section>

      <section id="page-transactions" hidden>
        <section class="panel">
          <div class="between">
            <h2 data-t="transactionsTitle"></h2>
            <div class="actions">
              <button id="exportCsv" class="btn light" data-t="exportCsv"></button>
              <button id="addTransaction" class="btn" data-t="addTransaction"></button>
            </div>
          </div>
          <div class="form-grid">
            <div class="field"><label for="filterMonth" data-t="filterMonth"></label><input id="filterMonth" type="month"></div>
            <div class="field"><label for="filterCategory" data-t="category"></label><select id="filterCategory"></select></div>
          </div>
          <div id="transactionList"></div>
        </section>
      </section>

      <section id="page-budget" hidden>
        <section class="panel">
          <h2 data-t="budgetPageTitle"></h2>
          <p class="muted" data-t="budgetHint"></p>
          <form id="budgetForm">
            <div class="form-grid">
              <div class="field"><label for="budgetMonth" data-t="month"></label><input id="budgetMonth" type="month" required></div>
              <div class="field"><label for="budgetAmount" data-t="budgetAmount"></label><input id="budgetAmount" type="number" min="0" step="0.01" required></div>
            </div>
            <button class="btn primary" type="submit" data-t="saveBudget"></button>
          </form>
          <div id="budgetDetail" style="margin-top:22px"></div>
        </section>
      </section>

      <section id="page-goals" hidden>
        <section class="panel">
          <h2 data-t="goalsTitle"></h2>
          <form id="goalForm">
            <div class="form-grid">
              <div class="field"><label for="goalName" data-t="goalName"></label><input id="goalName" required maxlength="60"></div>
              <div class="field"><label for="goalTarget" data-t="goalTarget"></label><input id="goalTarget" type="number" min="0.01" step="0.01" required></div>
              <div class="field"><label for="goalSaved" data-t="goalSaved"></label><input id="goalSaved" type="number" min="0" step="0.01" value="0"></div>
            </div>
            <button class="btn primary" type="submit" data-t="addGoal"></button>
          </form>
          <div id="goalList" style="margin-top:22px"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- إضافة/تعديل معاملة -->
  <div id="transactionDialog" class="overlay" hidden>
    <div class="dialog">
      <div class="between"><h2 id="transactionDialogTitle" data-t="addTransaction"></h2><button class="btn light small" data-close="transactionDialog" data-t="close"></button></div>
      <form id="transactionForm">
        <input id="transactionId" type="hidden">
        <div class="form-grid">
          <div class="field"><label for="txType" data-t="type"></label>
            <select id="txType"><option value="income" data-t="income"></option><option value="expense" data-t="expense"></option></select>
          </div>
          <div class="field"><label for="txAmount" data-t="amount"></label><input id="txAmount" type="number" min="0.01" step="0.01" required></div>
          <div class="field"><label for="txCategory" data-t="category"></label><select id="txCategory" required></select></div>
          <div class="field"><label for="txDate" data-t="date"></label><input id="txDate" type="date" required></div>
        </div>
        <div class="field"><label for="txNote" data-t="description"></label><input id="txNote" maxlength="120"></div>
        <button class="btn primary" type="submit" data-t="save"></button>
      </form>
    </div>
  </div>

  <!-- استعادة كلمة المرور -->
  <div id="recoveryDialog" class="overlay" hidden>
    <div class="dialog">
      <div class="between"><h2 data-t="forgot"></h2><button class="btn light small" data-close="recoveryDialog" data-t="close"></button></div>
      <p class="muted" data-t="recoveryHint"></p>
      <form id="recoveryForm">
        <div class="field"><label for="recoveryEmail" data-t="email"></label><input id="recoveryEmail" type="email" required></div>
        <div class="field"><label for="recoveryKey" data-t="recoveryKey"></label><input id="recoveryKey" required autocomplete="off"></div>
        <div class="field"><label for="recoveryNewPassword" data-t="newPassword"></label><input id="recoveryNewPassword" type="password" minlength="8" required autocomplete="new-password"></div>
        <button class="btn primary" type="submit" data-t="resetPassword"></button>
      </form>
    </div>
  </div>

  <div id="keyDialog" class="overlay" hidden>
    <div class="dialog center">
      <h2 data-t="saveRecoveryKey"></h2>
      <p class="muted" data-t="keyOneTime"></p>
      <div id="shownKey" class="recovery-key"></div>
      <button id="copyKey" class="btn light" style="margin:12px" data-t="copyKey"></button>
      <button id="closeKeyDialog" class="btn primary" data-t="understood"></button>
    </div>
  </div>

  <script>

    const categories = {

    };

    let lang = localStorage.getItem("dinar-smart-lang") || "ar";
    let account = null;
    let data = { transactions: [], goals: [], budgets: {} };
    let mode = "employee";
    const $ = id => document.getElementById(id);
    const t = key => translations[lang][key] || key;
    const localMonth = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    };
    const localDate = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };
    const money = n => new Intl.NumberFormat(lang === "ar" ? "ar-TN" : "fr-TN", {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }).format(Number(n) || 0) + " TND";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
    const acctDataKey = email => DATA_PREFIX + encodeURIComponent(email.toLowerCase());

    function applyLanguage() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-t]").forEach(el => {
        el.textContent = t(el.dataset.t);
      });
      document.querySelectorAll("[data-lang]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      if ($("filterCategory")) fillCategorySelect($("filterCategory"), true);
      if ($("txCategory")) updateTransactionCategories();
      if (!$("appScreen").hidden) render();
    }

    function setLang(next) {
      lang = next;
      localStorage.setItem("dinar-smart-lang", lang);
      applyLanguage();
    }

    async function hashPassword(password, saltHex) {
      if (!window.crypto?.subtle) throw new Error("NO_CRYPTO");
      const enc = new TextEncoder();
      const salt = Uint8Array.from(saltHex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:150000, hash:"SHA-256" }, key, 256);
      return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function randomHex(bytes = 16) {
      const arr = new Uint8Array(bytes);
      crypto.getRandomValues(arr);
      return [...arr].map(b => b.toString(16).padStart(2, "0")).join("");
    }
    async function initAccount() {
      account = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "null");
      if (!account) {
        const salt = randomHex();
        account = {
          email: ADMIN_EMAIL, salt,
          hash: await hashPassword(INITIAL_PASSWORD, salt),
          mustChange: true, recoverySalt: "", recoveryHash: ""
        };
        localStorage.setItem(ACCOUNT_KEY, JSON.stringify(account));
      }
      $("loginEmail").value = account.email;
    }
    function saveAccount() {
      localStorage.setItem(ACCOUNT_KEY, JSON.stringify(account));
    }
    function persist() {
      localStorage.setItem(acctDataKey(account.email), JSON.stringify(data));
    }
    function loadData() {
      try {
        data = JSON.parse(localStorage.getItem(acctDataKey(account.email)) || "null") ||
          { transactions: [], goals: [], budgets: {} };
      } catch {
        data = { transactions: [], goals: [], budgets: {} };
      }
      if (!Array.isArray(data.transactions)) data.transactions = [];
      if (!Array.isArray(data.goals)) data.goals = [];
      if (!data.budgets || typeof data.budgets !== "object") data.budgets = {};
    }

    function showOnly(id) {
      ["loginScreen", "changeScreen", "appScreen"].forEach(x => $(x).hidden = x !== id);
    }
    function openDialog(id) { $(id).hidden = false; }
    function closeDialog(id) { $(id).hidden = true; }
    function showRecoveryKey(key) {
      $("shownKey").textContent = key;
      openDialog("keyDialog");
    }
    function newRecoveryKey() {
      return randomHex(12).toUpperCase().match(/.{1,4}/g).join("-");
    }
    async function setNewPassword(password, mustChange = false) {
      const salt = randomHex();
      account.salt = salt;
      account.hash = await hashPassword(password, salt);
      account.mustChange = mustChange;
      const recovery = newRecoveryKey();
      account.recoverySalt = randomHex();
      account.recoveryHash = await hashPassword(recovery, account.recoverySalt);
      saveAccount();
      return recovery;
    }

    function formatCategory(code) {
      return categories[lang][code] || code || "—";
    }
    function categoriesFor(type, selectedMode = mode) {
      if (type === "income") return ["Salary", "Services", "OtherIncome"];
      if (selectedMode === "artisan") return ["Materials", "Tools", "BusinessTransport", "Fees", "OtherExpense"];
      return ["Food", "Housing", "Transport", "Health", "Shopping", "Education", "Leisure", "OtherExpense"];
    }
    function fillCategorySelect(select, includeAll = false) {
      const previous = select.value;
      const all = includeAll ? `<option value="">${esc(t("allCategories"))}</option>` : "";
      const list = [...new Set([...categoriesFor("income", "employee"), ...categoriesFor("expense", "employee"),
        ...categoriesFor("expense", "artisan")])];
      select.innerHTML = all + list.map(c => `<option value="${esc(c)}">${esc(formatCategory(c))}</option>`).join("");
      if ([...select.options].some(o => o.value === previous)) select.value = previous;
    }
    function updateTransactionCategories() {
      const type = $("txType").value;
      const previous = $("txCategory").value;
      $("txCategory").innerHTML = categoriesFor(type).map(c =>
        `<option value="${esc(c)}">${esc(formatCategory(c))}</option>`).join("");
      if ([...$("txCategory").options].some(o => o.value === previous)) $("txCategory").value = previous;
    }

    function monthTransactions(month) {
      return data.transactions.filter(tx => (tx.date || "").slice(0, 7) === month);
    }
    function total(list, type) {
      return list.filter(tx => tx.type === type).reduce((s, tx) => s + Number(tx.amount || 0), 0);
    }
    function render() {
      const month = localMonth();
      const monthTx = monthTransactions(month);
      const income = total(data.transactions, "income");
      const expense = total(data.transactions, "expense");
      const balance = income - expense;
      $("totalIncome").textContent = money(income);
      $("totalExpense").textContent = money(expense);
      $("balance").textContent = money(balance);
      $("balancePercent").textContent = income > 0
        ? `${Math.max(0, Math.round((balance / income) * 100))}% ${t("remaining")}`
        : "";

      $("monthLabel").textContent = new Intl.DateTimeFormat(lang === "ar" ? "ar-TN" : "fr-TN", {
        month: "long", year: "numeric"
      }).format(new Date(`${month}-01T12:00:00`));

      const budget = Number(data.budgets[month] || 0);
      const spent = total(monthTx, "expense");
      const pct = budget > 0 ? Math.min(100, Math.round(spent / budget * 100)) : 0;
      $("budgetBar").style.width = `${pct}%`;
      $("budgetBar").classList.toggle("over", budget > 0 && spent > budget);
      $("budgetNumbers").textContent = budget > 0
        ? `${t("budgetUsed")}: ${money(spent)} / ${money(budget)} (${Math.round(spent / budget * 100)}%)`
        : t("noBudgetYet");
      $("budgetSummary").innerHTML = budget > 0
        ? `<p>${esc(t("budgetUsed"))}: <b>${esc(money(spent))}</b> ${esc(t("ofBudget"))} ${esc(money(budget))}</p>`
        : `<p class="muted">${esc(t("noBudget"))}</p>`;

      const alerts = [];
      if (budget > 0 && spent > budget) alerts.push(`<div class="alert danger">${esc(t("budgetExceeded"))}</div>`);
      else if (budget > 0 && spent >= budget * .8) alerts.push(`<div class="alert warn">${esc(t("spent80"))}</div>`);
      $("alerts").innerHTML = alerts.join("");

      const isArtisan = mode === "artisan";
      $("artisanSummary").hidden = !isArtisan;
      if (isArtisan) {
        const business = data.transactions.filter(tx => tx.mode === "artisan");
        const serviceIncome = total(business, "income");
        const proExpense = total(business, "expense");
        $("serviceIncome").textContent = money(serviceIncome);
        $("professionalExpense").textContent = money(proExpense);
        $("profit").textContent = money(serviceIncome - proExpense);
      }

      const expenseByCat = {};
      data.transactions.filter(tx => tx.type === "expense").forEach(tx => {
        expenseByCat[tx.category] = (expenseByCat[tx.category] || 0) + Number(tx.amount || 0);
      });
      const catEntries = Object.entries(expenseByCat).sort((a,b) => b[1] - a[1]);
      const maxCat = catEntries[0]?.[1] || 1;
      $("categoryChart").innerHTML = catEntries.length ? catEntries.slice(0, 8).map(([cat, val]) =>
        `<div class="category-row"><div class="between"><span>${esc(formatCategory(cat))}</span><small>${esc(money(val))}</small></div>
        <div class="bar-bg"><div class="bar" style="width:${Math.max(4, val/maxCat*100)}%"></div></div></div>`
      ).join("") : `<div class="empty">${esc(t("noTransactions"))}</div>`;

      renderTransactionLists();
      renderBudgetDetail();
      renderGoals();
      applyPageLabels();
    }

    function transactionMarkup(tx, includeActions = true) {
      const typeClass = tx.type === "income" ? "income" : "expense";
      const typeLabel = tx.type === "income" ? t("income") : t("expense");
      return `<tr>
        <td>${esc(tx.date || "")}</td>
        <td>${esc(tx.description || "—")}</td>
        <td><span class="tag">${esc(formatCategory(tx.category))}</span></td>
        <td class="${typeClass}">${esc(typeLabel)}</td>
        <td>${esc(money(tx.amount))}</td>
        ${includeActions ? `<td><div class="actions">
          <button class="btn light small" data-edit="${esc(tx.id)}">${esc(t("edit"))}</button>
          <button class="btn danger small" data-delete-tx="${esc(tx.id)}">${esc(t("delete"))}</button>
        </div></td>` : ""}
      </tr>`;
    }

    function renderTransactionLists() {
      const recent = [...data.transactions].sort((a,b) => (b.date || "").localeCompare(a.date || "")).slice(0, 5);
      $("recentList").innerHTML = recent.length
        ? `<div class="table-wrap"><table><thead><tr>
            <th>${esc(t("date"))}</th><th>${esc(t("description"))}</th><th>${esc(t("category"))}</th>
            <th>${esc(t("type"))}</th><th>${esc(t("amount"))}</th></tr></thead><tbody>
            ${recent.map(tx => transactionMarkup(tx, false)).join("")}</tbody></table></div>`
        : `<div class="empty">${esc(t("noTransactions"))}</div>`;

      const month = $("filterMonth").value;
      const cat = $("filterCategory").value;
      const list = [...data.transactions]
        .filter(tx => (!month || (tx.date || "").slice(0,7) === month))
        .filter(tx => (!cat || tx.category === cat))
        .sort((a,b) => (b.date || "").localeCompare(a.date || ""));
      $("transactionList").innerHTML = list.length
        ? `<div class="table-wrap"><table><thead><tr>
            <th>${esc(t("date"))}</th><th>${esc(t("description"))}</th><th>${esc(t("category"))}</th>
            <th>${esc(t("type"))}</th><th>${esc(t("amount"))}</th><th></th></tr></thead><tbody>
            ${list.map(tx => transactionMarkup(tx, true)).join("")}</tbody></table></div>`
        : `<div class="empty">${esc(t("noTransactions"))}</div>`;
    }

    function renderBudgetDetail() {
      const month = $("budgetMonth").value || localMonth();
      const budget = Number(data.budgets[month] || 0);
      const spent = total(monthTransactions(month), "expense");
      const pct = budget > 0 ? Math.round(spent / budget * 100) : 0;
      $("budgetDetail").innerHTML = budget > 0
        ? `<h3>${esc(month)} — ${esc(money(budget))}</h3>
           <p>${esc(t("budgetUsed"))}: ${esc(money(spent))} (${pct}%)</p>
           <div class="bar-bg"><div class="bar ${spent > budget ? "over" : ""}" style="width:${Math.min(100,pct)}%"></div></div>`
        : `<div class="empty">${esc(t("noBudget"))}</div>`;
    }

    function renderGoals() {
      $("goalList").innerHTML = data.goals.length ? data.goals.map(goal => {
        const target = Number(goal.target) || 0;
        const saved = Number(goal.saved) || 0;
        const pct = target > 0 ? Math.min(100, Math.round(saved / target * 100)) : 0;
        return `<article class="goal">
          <div class="between"><h3>${esc(goal.name)}</h3><button class="btn danger small" data-delete-goal="${esc(goal.id)}">${esc(t("delete"))}</button></div>
          <div class="goal-meta">${esc(t("saved"))}: ${esc(money(saved))} · ${esc(t("target"))}: ${esc(money(target))} · ${esc(t("goalProgress"))}: ${pct}%</div>
          <div class="bar-bg"><div class="bar" style="width:${pct}%"></div></div>
          <div class="actions" style="margin-top:10px">
            <input type="number" min="0.01" step="0.01" placeholder="${esc(t("amount"))}" id="contrib-${esc(goal.id)}" style="max-width:180px">
            <button class="btn light small" data-contribute="${esc(goal.id)}">${esc(t("addSaving"))}</button>
          </div>
        </article>`;
      }).join("") : `<div class="empty">${esc(t("noGoals"))}</div>`;
    }

    function applyPageLabels() {
      document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll("[data-lang]").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
    }

    function openTransaction(tx = null) {
      $("transactionForm").reset();
      $("transactionId").value = tx?.id || "";
      $("txDate").value = tx?.date || localDate();
      $("txType").value = tx?.type || "expense";
      $("txAmount").value = tx?.amount || "";
      $("txNote").value = tx?.description || "";
      $("transactionDialogTitle").textContent = tx ? t("edit") : t("addTransaction");
      updateTransactionCategories();
      if (tx) $("txCategory").value = tx.category;
      openDialog("transactionDialog");
    }

    function setPage(page) {
      document.querySelectorAll("[id^='page-']").forEach(p => p.hidden = p.id !== `page-${page}`);
      document.querySelectorAll("[data-page]").forEach(b => b.classList.toggle("active", b.dataset.page === page));
      if (page === "transactions") renderTransactionLists();
      if (page === "budget") renderBudgetDetail();
    }

    function downloadCsv() {
      const rows = [[t("date"), t("type"), t("category"), t("description"), t("amount"), "TND", "mode"]];
      [...data.transactions].sort((a,b) => (a.date || "").localeCompare(b.date || "")).forEach(tx => {
        rows.push([tx.date || "", tx.type === "income" ? t("income") : t("expense"),
          formatCategory(tx.category), tx.description || "", Number(tx.amount).toFixed(2), "TND",
          tx.mode === "artisan" ? t("artisan") : t("employee")]);
      });
      const csv = "\uFEFF" + rows.map(row => row.map(value =>
        `"${String(value).replace(/"/g, '""')}"`
      ).join(";")).join("\r\n");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
      link.download = `dinar-smart-${localDate()}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    document.addEventListener("click", async event => {
      const langBtn = event.target.closest("[data-lang]");
      if (langBtn) setLang(langBtn.dataset.lang);

      const modeBtn = event.target.closest("[data-mode]");
      if (modeBtn) {
        mode = modeBtn.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b === modeBtn));
        render();
      }

      const pageBtn = event.target.closest("[data-page]");
      if (pageBtn) setPage(pageBtn.dataset.page);
      const goBtn = event.target.closest("[data-go]");
      if (goBtn) setPage(goBtn.dataset.go);

      const closeBtn = event.target.closest("[data-close]");
      if (closeBtn) closeDialog(closeBtn.dataset.close);

      const toggle = event.target.closest("[data-toggle]");
      if (toggle) {
        const field = $(toggle.dataset.toggle);
        field.type = field.type === "password" ? "text" : "password";
        toggle.textContent = field.type === "password" ? t("show") : t("hide");
      }

      const editBtn = event.target.closest("[data-edit]");
      if (editBtn) openTransaction(data.transactions.find(tx => tx.id === editBtn.dataset.edit));

      const deleteTx = event.target.closest("[data-delete-tx]");
      if (deleteTx && confirm(t("confirmDelete"))) {
        data.transactions = data.transactions.filter(tx => tx.id !== deleteTx.dataset.deleteTx);
        persist(); render();
      }

      const deleteGoal = event.target.closest("[data-delete-goal]");
      if (deleteGoal && confirm(t("confirmGoalDelete"))) {
        data.goals = data.goals.filter(goal => goal.id !== deleteGoal.dataset.deleteGoal);
        persist(); render();
      }

      const contribute = event.target.closest("[data-contribute]");
      if (contribute) {
        const input = $(`contrib-${contribute.dataset.contribute}`);
        const value = Number(input.value);
        if (value > 0) {
          const goal = data.goals.find(g => g.id === contribute.dataset.contribute);
          if (goal) goal.saved = Number(goal.saved || 0) + value;
          persist(); render();
        }
      }
    });

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        const email = $("loginEmail").value.trim().toLowerCase();
        const password = $("loginPassword").value;
        if (email !== account.email.toLowerCase()) return alert(t("emailMismatch"));
        if (await hashPassword(password, account.salt) !== account.hash) return alert(t("invalidLogin"));
        if (account.mustChange) showOnly("changeScreen");
        else {
          loadData();
          showOnly("appScreen");
          $("filterMonth").value = localMonth();
          $("budgetMonth").value = localMonth();
          render();
        }
      } catch (error) {
        alert(error.message === "NO_CRYPTO" ? t("browserCrypto") : t("invalidLogin"));
      }
    });

    $("changeForm").addEventListener("submit", async event => {
      event.preventDefault();
      const password = $("newPassword").value;
      if (password.length < 8) return alert(t("minPassword"));
      if (password !== $("confirmPassword").value) return alert(t("passwordsMismatch"));
      try {
        const key = await setNewPassword(password, false);
        $("changeForm").reset();
        showRecoveryKey(key);
      } catch { alert(t("browserCrypto")); }
    });

    $("openRecovery").addEventListener("click", () => openDialog("recoveryDialog"));
    $("recoveryForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = $("recoveryEmail").value.trim().toLowerCase();
      const keyInput = $("recoveryKey").value.trim().toUpperCase();
      const newPassword = $("recoveryNewPassword").value;
      if (newPassword.length < 8) return alert(t("minPassword"));
      if (email !== account.email.toLowerCase()) return alert(t("resetFailed"));
      try {
        let valid = false;
        if (account.recoveryHash && account.recoverySalt) {
          valid = await hashPassword(keyInput, account.recoverySalt) === account.recoveryHash;
        } else if (account.mustChange) {
          valid = await hashPassword(keyInput, account.salt) === account.hash;
        }
        if (!valid) return alert(t("resetFailed"));
        const key = await setNewPassword(newPassword, false);
        $("recoveryForm").reset();
        closeDialog("recoveryDialog");
        alert(t("recoverySaved"));
        showRecoveryKey(key);
      } catch { alert(t("browserCrypto")); }
    });

    $("closeKeyDialog").addEventListener("click", () => {
      closeDialog("keyDialog");
      loadData();
      $("filterMonth").value = localMonth();
      $("budgetMonth").value = localMonth();
      showOnly("appScreen");
      render();
    });
    $("copyKey").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText($("shownKey").textContent);
        $("copyKey").textContent = lang === "ar" ? "تم النسخ" : "Copié";
      } catch {
        alert($("shownKey").textContent);
      }
    });

    $("logout").addEventListener("click", () => {
      $("loginPassword").value = "";
      showOnly("loginScreen");
    });
    $("addTransaction").addEventListener("click", () => openTransaction());
    $("txType").addEventListener("change", updateTransactionCategories);
    $("filterMonth").addEventListener("change", renderTransactionLists);
    $("filterCategory").addEventListener("change", renderTransactionLists);
    $("exportCsv").addEventListener("click", downloadCsv);

    $("transactionForm").addEventListener("submit", event => {
      event.preventDefault();
      const amount = Number($("txAmount").value);
      if (!(amount > 0)) return alert(t("invalidAmount"));
      const id = $("transactionId").value || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      const tx = {
        id, type: $("txType").value, amount, category: $("txCategory").value,
        date: $("txDate").value, description: $("txNote").value.trim(), mode
      };
      const index = data.transactions.findIndex(item => item.id === id);
      if (index >= 0) data.transactions[index] = tx;
      else data.transactions.push(tx);
      persist(); closeDialog("transactionDialog"); render();
    });

    $("budgetForm").addEventListener("submit", event => {
      event.preventDefault();
      const month = $("budgetMonth").value;
      const amount = Number($("budgetAmount").value);
      if (!month || amount < 0) return;
      data.budgets[month] = amount;
      persist(); render();
      alert(t("budgetSaved"));
    });
    $("budgetMonth").addEventListener("change", renderBudgetDetail);

    $("goalForm").addEventListener("submit", event => {
      event.preventDefault();
      const target = Number($("goalTarget").value);
      const saved = Number($("goalSaved").value || 0);
      if (!(target > 0) || saved < 0) return alert(t("invalidAmount"));
      data.goals.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name: $("goalName").value.trim(), target, saved
      });
      persist(); $("goalForm").reset(); $("goalSaved").value = "0"; render();
    });

    $("filterCategory").innerHTML = "";
    fillCategorySelect($("filterCategory"), true);
    $("filterMonth").value = localMonth();
    $("budgetMonth").value = localMonth();
    applyLanguage();

    initAccount().catch(() => alert(t("browserCrypto")));
  </script>
</body>
</html>
