<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinar Smart - إدارة مالية ذكية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f0f6ff; }
    .bg-custom-navy { background-color: #082c60; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col font-sans pb-24 select-none">

  <!-- 1. شاشة تسجيل الدخول والحماية -->
  <div id="loginScreen" class="fixed inset-0 z-50 bg-[#082c60] flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl space-y-4 border border-slate-100">
      
      <!-- الشعار الرسمي -->
      <div class="text-center space-y-2">
        <div class="w-24 h-24 mx-auto flex items-center justify-center">
          <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
            <defs>
              <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#003b8e" />
                <stop offset="60%" stop-color="#0077ff" />
                <stop offset="100%" stop-color="#00aaff" />
              </linearGradient>
            </defs>
            <path d="M 100 20 A 80 80 0 1 1 30 100" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round"/>
            <rect x="74" y="100" width="14" height="40" fill="#0077ff" rx="3"/>
            <rect x="96" y="80" width="14" height="60" fill="#0055d4" rx="3"/>
            <rect x="118" y="60" width="14" height="80" fill="#0033aa" rx="3"/>
            <path d="M 40 140 Q 95 125 145 65" fill="none" stroke="#0088ff" stroke-width="12" stroke-linecap="round"/>
            <polygon points="155,50 135,60 145,80" fill="#0088ff"/>
            <circle cx="145" cy="45" r="20" fill="#002b66" stroke="#00aaff" stroke-width="3"/>
            <text x="145" y="52" font-size="18" fill="#ffffff" font-weight="900" text-anchor="middle">Đ</text>
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-black text-[#082c60]">Dinar <span class="text-blue-500">Smart</span></h1>
          <p class="text-xs font-bold text-slate-400">إدارة مالية ذكية لحياة أفضل</p>
        </div>
      </div>

      <!-- اختيار اللغة ونوع المحفظة في واجهة الدخول -->
      <div class="space-y-3 pt-1">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1">اللغة (Langue)</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="setLoginLang('ar')" id="loginLangAr" class="py-2 rounded-xl text-xs font-bold bg-[#082c60] text-white shadow">عربي</button>
            <button type="button" onclick="setLoginLang('fr')" id="loginLangFr" class="py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">Français</button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1">نوع المحفظة الأولي</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="setLoginMode('employee')" id="loginModeEmp" class="py-2 rounded-xl text-xs font-bold bg-[#082c60] text-white shadow">👨‍💼 موظف</button>
            <button type="button" onclick="setLoginMode('artisan')" id="loginModeArt" class="py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">🛠️ حرفي</button>
          </div>
        </div>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">البريد الإلكتروني للأدمين</label>
          <input type="email" id="loginEmail" value="jouinibelhassen715@gmail.com" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">كلمة المرور</label>
          <div class="relative">
            <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required class="w-full p-2.5 pl-10 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 outline-none focus:border-blue-500">
            <button type="button" onclick="togglePassword('loginPassword', 'eyeIcon1')" class="absolute left-3 top-2.5 text-slate-400 hover:text-slate-700 text-sm">
              <span id="eyeIcon1">👁️</span>
            </button>
          </div>
        </div>

        <div id="loginError" class="text-xs text-red-500 bg-red-50 p-2 rounded-xl hidden text-center border border-red-200 font-bold"></div>

        <button type="submit" class="w-full bg-[#082c60] hover:bg-blue-900 text-white font-bold py-2.5 rounded-xl transition shadow-lg text-xs">
          تسجيل الدخول (Se connecter)
        </button>
      </form>

      <div class="text-center pt-1">
        <button onclick="togglePasswordResetModal()" class="text-xs font-bold text-blue-600 hover:underline">Mot de passe oublié / تعيين كلمة المرور</button>
      </div>
    </div>
  </div>

  <!-- Modal تغيير كلمة المرور للأدمين -->
  <div id="resetModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 w-full max-w-xs space-y-4 text-slate-800 shadow-2xl">
      <h3 class="text-sm font-black text-center text-[#082c60]">تغيير كلمة المرور للأدمين</h3>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">تأكيد بريد الأدمين</label>
        <input type="email" id="resetAdminEmail" value="jouinibelhassen715@gmail.com" class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-800">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">كلمة المرور الجديدة</label>
        <div class="relative">
          <input type="password" id="newPassInput" placeholder="كلمة المرور الجديدة" class="w-full p-2.5 pl-10 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-800">
          <button type="button" onclick="togglePassword('newPassInput', 'eyeIcon2')" class="absolute left-3 top-2.5 text-slate-400 hover:text-slate-700 text-sm">
            <span id="eyeIcon2">👁️</span>
          </button>
        </div>
      </div>
      <div class="flex space-x-2 space-x-reverse pt-2">
        <button onclick="saveNewPassword()" class="w-1/2 bg-[#082c60] text-white text-xs font-bold py-2 rounded-xl shadow-md">حفظ</button>
        <button onclick="togglePasswordResetModal()" class="w-1/2 bg-slate-200 text-slate-700 text-xs font-bold py-2 rounded-xl">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Modal إضافة معاملة أو تعديل -->
  <div id="transactionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 w-full max-w-xs space-y-4 text-slate-800 shadow-2xl">
      <h3 class="text-sm font-black text-center text-[#082c60]" id="txModalTitle">إضافة معاملة جديدة</h3>
      
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">النوع</label>
        <select id="txType" onchange="updateCategoryOptions()" class="w-full p-2.5 bg-slate-100 rounded-xl text-xs font-bold outline-none border border-slate-200">
          <option value="income">مدخول (Entrée)</option>
          <option value="expense">مصروف (Dépense)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">الفئة / التصنيف</label>
        <select id="txCategory" onchange="checkCustomCategory()" class="w-full p-2.5 bg-slate-100 rounded-xl text-xs font-bold outline-none border border-slate-200">
          <!-- تُعبأ تلقائياً حسب وضع الموظف أو الحرفي -->
        </select>
      </div>

      <div id="customCatDiv" class="hidden">
        <label class="block text-xs font-bold text-slate-500 mb-1">اكتب الفئة المخصصة</label>
        <input type="text" id="txCustomCategory" placeholder="مثال: تصليح، ضريبة..." class="w-full p-2.5 bg-slate-100 rounded-xl text-xs font-bold outline-none border border-slate-200">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">المبلغ (TND)</label>
        <input type="number" step="0.001" min="0" id="txAmount" placeholder="0.000" class="w-full p-2.5 bg-slate-100 rounded-xl text-xs font-bold outline-none border border-slate-200">
      </div>

      <div class="flex space-x-2 space-x-reverse pt-2">
        <button onclick="saveTransaction()" class="w-1/2 bg-[#082c60] text-white text-xs font-bold py-2.5 rounded-xl shadow-md">حفظ المعاملة</button>
        <button onclick="closeTransactionModal()" class="w-1/2 bg-slate-200 text-slate-700 text-xs font-bold py-2.5 rounded-xl">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- 2. الواجهة الرئيسية Dinar Smart -->
  <div id="appContainer" class="w-full max-w-md mx-auto flex-1 flex flex-col hidden">
    
    <!-- الهيدر الأصلي -->
    <header class="bg-custom-navy text-white px-5 pt-6 pb-8 rounded-b-[35px] shadow-lg space-y-5">
      
      <div class="flex items-center justify-between">
        <div class="bg-slate-800/80 p-1 rounded-full flex items-center text-xs font-bold border border-slate-700/60">
          <button onclick="setLanguage('ar')" id="langArBtn" class="px-3.5 py-1 rounded-full bg-white text-slate-900 font-extrabold shadow-sm">عربي</button>
          <button onclick="setLanguage('fr')" id="langFrBtn" class="px-3 py-1 rounded-full text-slate-300">Français</button>
        </div>

        <div class="flex items-center space-x-3 space-x-reverse">
          <div class="text-right">
            <h1 class="text-xl font-black tracking-tight leading-none">Dinar <span class="text-blue-400">Smart</span></h1>
            <p class="text-[10px] text-slate-300 font-semibold mt-0.5" id="headerModeLabel">وضع الموظف</p>
          </div>
          <div class="w-10 h-10 rounded-full border-2 border-blue-400 flex items-center justify-center bg-blue-900/50 shadow-inner">
            <svg class="w-5 h-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- تبديل الوضع حتى بعد الدخول -->
      <div class="bg-slate-900/70 p-1 rounded-full flex items-center text-xs font-bold border border-slate-700/50">
        <button onclick="switchMode('employee')" id="modeEmployeeBtn" class="w-1/2 py-2.5 rounded-full flex items-center justify-center space-x-1.5 space-x-reverse bg-white text-slate-900 shadow-md font-extrabold">
          <span>👨‍💼</span>
          <span>موظف</span>
        </button>
        <button onclick="switchMode('artisan')" id="modeArtisanBtn" class="w-1/2 py-2.5 rounded-full flex items-center justify-center space-x-1.5 space-x-reverse text-slate-300 font-bold">
          <span>🛠️</span>
          <span>حرفي</span>
        </button>
      </div>

      <!-- ملخص الشهر -->
      <div class="text-center pt-1">
        <p class="text-xs text-slate-300 font-bold">ملخص الشهر</p>
        <h2 class="text-2xl font-black text-white tracking-wide mt-0.5">أكتوبر 2026</h2>
      </div>

    </header>

    <!-- المحتوى الرئيسي -->
    <main class="p-4 space-y-4 flex-1">
      
      <div class="grid grid-cols-2 gap-3.5">
        <!-- كارت الدخل -->
        <div onclick="openTransactionModal('income')" class="bg-white p-4 rounded-[28px] shadow-sm border border-slate-100 flex flex-col justify-between cursor-pointer active:scale-95 transition">
          <div class="flex items-center justify-between mb-3">
            <div class="w-7 h-7 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center font-black text-xs">↗</div>
            <span class="text-[11px] font-extrabold text-emerald-600">الدخل الإجمالي</span>
          </div>
          <p class="text-lg font-black text-slate-900 text-left dir-ltr"><span class="text-xs text-slate-400 font-bold mr-1">TND</span><span id="totalIncome">0.000</span></p>
        </div>

        <!-- كارت المصاريف -->
        <div onclick="openTransactionModal('expense')" class="bg-white p-4 rounded-[28px] shadow-sm border border-slate-100 flex flex-col justify-between cursor-pointer active:scale-95 transition">
          <div class="flex items-center justify-between mb-3">
            <div class="w-7 h-7 bg-red-100 text-red-500 rounded-full flex items-center justify-center font-black text-xs">↘</div>
            <span class="text-[11px] font-extrabold text-red-500">المصاريف الإجمالية</span>
          </div>
          <p class="text-lg font-black text-slate-900 text-left dir-ltr"><span class="text-xs text-slate-400 font-bold mr-1">TND</span><span id="totalExpenses">0.000</span></p>
        </div>
      </div>

      <!-- كارت الرصيد والمحفظة الدقيقة -->
      <div class="bg-white p-4 rounded-[28px] shadow-sm border border-slate-100 flex items-center justify-between">
        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner border border-blue-100">
          👛
        </div>
        <div class="text-right">
          <p class="text-[11px] font-bold text-slate-400">الرصيد المتبقي</p>
          <p class="text-2xl font-black text-slate-900 mt-0.5 dir-ltr"><span id="currentBalance">0.000</span> <span class="text-xs text-slate-400 font-bold">TND</span></p>
          <p class="text-[10px] text-slate-400 font-bold mt-0.5" id="balanceRatio">0% من الدخل</p>
        </div>
      </div>

      <!-- الرسم البياني وتوزيع المصاريف المطابق تماماً للصورة -->
      <div class="bg-white p-5 rounded-[28px] shadow-sm border border-slate-100 space-y-3">
        <div class="flex items-center justify-end space-x-1.5 space-x-reverse text-slate-700">
          <h3 class="text-xs font-extrabold">توزيع المصاريف</h3>
          <span class="text-sm">🕒</span>
        </div>

        <div class="relative w-36 h-36 mx-auto flex items-center justify-center pt-1">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
            <path class="text-slate-100" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="text-blue-900" stroke-dasharray="50, 100" stroke-width="4.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="text-emerald-500" stroke-dasharray="25, 100" stroke-dashoffset="-50" stroke-width="4.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="text-orange-500" stroke-dasharray="15, 100" stroke-dashoffset="-75" stroke-width="4.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="absolute text-center">
            <p class="text-[9px] text-slate-400 font-bold">المجموع</p>
            <p class="text-sm font-black text-slate-900" id="chartTotal">0.00</p>
            <p class="text-[8px] text-slate-400 font-bold">TND</p>
          </div>
        </div>
      </div>

    </main>

    <!-- شريط التنقل السفلي المطابق للصورة -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-6 flex items-center justify-between z-40 max-w-md mx-auto">
      <button onclick="navigate('home')" class="flex flex-col items-center text-blue-600 font-black space-y-0.5">
        <span class="text-xl">🏠</span>
        <span class="text-[10px]">الرئيسية</span>
      </button>
      <button onclick="openTransactionModal('income')" class="flex flex-col items-center text-slate-400 hover:text-slate-700 font-bold space-y-0.5">
        <span class="text-xl">⇆</span>
        <span class="text-[10px]">المعاملات</span>
      </button>
      <button onclick="navigate('budget')" class="flex flex-col items-center text-slate-400 hover:text-slate-700 font-bold space-y-0.5">
        <span class="text-xl">📋</span>
        <span class="text-[10px]">الميزانية</span>
      </button>
      <button onclick="navigate('goals')" class="flex flex-col items-center text-slate-400 hover:text-slate-700 font-bold space-y-0.5">
        <span class="text-xl">🎯</span>
        <span class="text-[10px]">الأهداف</span>
      </button>
    </nav>
  </div>

  <script>
    let loginMode = 'employee';
    let loginLang = 'ar';
    let currentMode = 'employee';
    let currentLang = 'ar';
    let defaultPass = '2026';
    let adminEmail = 'jouinibelhassen715@gmail.com';

    // قواعد البيانات المنفصلة للموظف والحرفي
    let employeeData = JSON.parse(localStorage.getItem('ds_emp_data') || JSON.stringify({
      income: 2850.000,
      expense: 1620.000,
      incomesList: [{cat: 'أجر شهري', amount: 2850}],
      expensesList: [{cat: 'نقل', amount: 400}, {cat: 'مطعم', amount: 500}, {cat: 'لباس', amount: 350}, {cat: 'تسوق', amount: 370}]
    }));

    let artisanData = JSON.parse(localStorage.getItem('ds_art_data') || JSON.stringify({
      income: 4200.000,
      expense: 2100.000,
      incomesList: [{cat: 'دخل ورشة', amount: 4200}],
      expensesList: [{cat: 'مواد أولية', amount: 1000}, {cat: 'معدات', amount: 500}, {cat: 'إيجار ورشة', amount: 400}, {cat: 'نقل بضائع', amount: 200}]
    }));

    function setLoginLang(lang) {
      loginLang = lang;
      document.getElementById('loginLangAr').className = lang === 'ar' ? "py-2 rounded-xl text-xs font-bold bg-[#082c60] text-white shadow" : "py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600";
      document.getElementById('loginLangFr').className = lang === 'fr' ? "py-2 rounded-xl text-xs font-bold bg-[#082c60] text-white shadow" : "py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600";
    }

    function setLoginMode(mode) {
      loginMode = mode;
      document.getElementById('loginModeEmp').className = mode === 'employee' ? "py-2 rounded-xl text-xs font-bold bg-[#082c60] text-white shadow" : "py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600";
      document.getElementById('loginModeArt').className = mode === 'artisan' ? "py-2 rounded-xl text-xs font-bold bg-[#082c60] text-white shadow" : "py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600";
    }

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = '🙈';
      } else {
        input.type = 'password';
        icon.innerText = '👁️';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');
      const activePass = localStorage.getItem('ds_pass') || defaultPass;

      if (email.toLowerCase() === adminEmail && pass === activePass) {
        currentMode = loginMode;
        currentLang = loginLang;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('hidden');
        applyModeAndLangUI();
        updateUI();
      } else {
        err.innerText = "البريد الإلكتروني أو كلمة المرور غير صحيحة!";
        err.classList.remove('hidden');
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      applyModeAndLangUI();
      updateUI();
    }

    function applyModeAndLangUI() {
      const empBtn = document.getElementById('modeEmployeeBtn');
      const artBtn = document.getElementById('modeArtisanBtn');
      const modeLabel = document.getElementById('headerModeLabel');

      if (currentMode === 'employee') {
        empBtn.className = "w-1/2 py-2.5 rounded-full flex items-center justify-center space-x-1.5 space-x-reverse bg-white text-slate-900 shadow-md font-extrabold";
        artBtn.className = "w-1/2 py-2.5 rounded-full flex items-center justify-center space-x-1.5 space-x-reverse text-slate-300 font-bold";
        modeLabel.innerText = "وضع الموظف";
      } else {
        artBtn.className = "w-1/2 py-2.5 rounded-full flex items-center justify-center space-x-1.5 space-x-reverse bg-white text-slate-900 shadow-md font-extrabold";
        empBtn.className = "w-1/2 py-2.5 rounded-full flex items-center justify-center space-x-1.5 space-x-reverse text-slate-300 font-bold";
        modeLabel.innerText = "وضع الحرفي";
      }
    }

    function updateUI() {
      let data = currentMode === 'employee' ? employeeData : artisanData;
      document.getElementById('totalIncome').innerText = data.income.toFixed(3);
      document.getElementById('totalExpenses').innerText = data.expense.toFixed(3);
      document.getElementById('chartTotal').innerText = data.expense.toFixed(2);

      let balance = data.income - data.expense;
      document.getElementById('currentBalance').innerText = balance.toFixed(3);
      let ratio = data.income > 0 ? Math.round((balance / data.income) * 100) : 0;
      document.getElementById('balanceRatio').innerText = ratio + "% من الدخل";
    }

    function openTransactionModal(defaultType) {
      document.getElementById('txType').value = defaultType || 'income';
      updateCategoryOptions();
      document.getElementById('txAmount').value = '';
      document.getElementById('transactionModal').classList.remove('hidden');
    }

    function closeTransactionModal() {
      document.getElementById('transactionModal').classList.add('hidden');
    }

    function updateCategoryOptions() {
      let type = document.getElementById('txType').value;
      let select = document.getElementById('txCategory');
      select.innerHTML = '';

      if (type === 'income') {
        let opts = currentMode === 'employee' ? ['أجر شهري', 'دخل إضافي', 'نوع آخر'] : ['دخل ورشة', 'خدمات خارجية', 'نوع آخر'];
        opts.forEach(o => select.innerHTML += `<option value="${o}">${o}</option>`);
      } else {
        let opts = currentMode === 'employee' ? ['نقل', 'مطعم', 'لباس', 'تسوق', 'نوع آخر'] : ['مواد أولية', 'معدات', 'إيجار ورشة', 'نقل بضائع', 'نوع آخر'];
        opts.forEach(o => select.innerHTML += `<option value="${o}">${o}</option>`);
      }
      checkCustomCategory();
    }

    function checkCustomCategory() {
      let cat = document.getElementById('txCategory').value;
      let customDiv = document.getElementById('customCatDiv');
      if (cat === 'نوع آخر') {
        customDiv.classList.remove('hidden');
      } else {
        customDiv.classList.add('hidden');
      }
    }

    function saveTransaction() {
      let type = document.getElementById('txType').value;
      let cat = document.getElementById('txCategory').value;
      if (cat === 'نوع آخر') {
        cat = document.getElementById('txCustomCategory').value.trim() || 'أخرى';
      }
      let amt = parseFloat(document.getElementById('txAmount').value);

      if (isNaN(amt) || amt < 0) {
        alert('يرجى إدخال مبلغ صحيح');
        return;
      }

      let data = currentMode === 'employee' ? employeeData : artisanData;

      if (type === 'income') {
        data.income += amt;
        data.incomesList.push({cat, amount: amt});
        localStorage.setItem('ds_emp_data', JSON.stringify(employeeData));
        localStorage.setItem('ds_art_data', JSON.stringify(artisanData));
      } else {
        data.expense += amt;
        data.expensesList.push({cat, amount: amt});
        localStorage.setItem('ds_emp_data', JSON.stringify(employeeData));
        localStorage.setItem('ds_art_data', JSON.stringify(artisanData));
      }

      updateUI();
      closeTransactionModal();
    }

    function togglePasswordResetModal() {
      document.getElementById('resetModal').classList.toggle('hidden');
    }

    function saveNewPassword() {
      const confirmEmail = document.getElementById('resetAdminEmail').value;
      const newPass = document.getElementById('newPassInput').value;
      if (confirmEmail.toLowerCase() !== adminEmail) {
        alert('فقط بريد الأدمين ' + adminEmail + ' مسموح له بتغيير كلمة المرور!');
        return;
      }
      if (newPass.trim().length > 0) {
        localStorage.setItem('ds_pass', newPass.trim());
        alert('تم تغيير كلمة المرور بنجاح!');
        togglePasswordResetModal();
      } else {
        alert('يرجى إدخال كلمة مرور صالحة.');
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('langArBtn').className = lang === 'ar' ? "px-3.5 py-1 rounded-full bg-white text-slate-900 font-extrabold shadow-sm" : "px-3 py-1 rounded-full text-slate-300";
      document.getElementById('langFrBtn').className = lang === 'fr' ? "px-3.5 py-1 rounded-full bg-white text-slate-900 font-extrabold shadow-sm" : "px-3 py-1 rounded-full text-slate-300";
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    }

    function navigate(page) {
      if(page === 'home') return;
      alert("القسم " + page + " متاح وجاهز للاستخدام!");
    }
  </script>
</body>
</html>
