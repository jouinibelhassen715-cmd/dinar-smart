<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#082C60">
<title>Dinar Smart</title>
<style>
:root{--navy:#082C60;--blue:#1677C8;--sky:#DDF2FF;--bg:#EAF7FF;--ink:#17263C;--muted:#6C7B8D;--green:#09845A;--red:#C43B50;--line:#D8E8F3;--shadow:0 10px 28px #082c6017;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.top{background:var(--navy);color:white;padding:18px 5vw 75px;border-radius:0 0 28px 28px}.topbar,.brand,.actions,.between{display:flex;align-items:center}.topbar,.between{justify-content:space-between;gap:12px}
.brand{gap:11px;font-size:1.3rem;font-weight:800}.brand b{color:#58B9FF}.brand-mark{width:44px;height:44px;border:2px solid #B8DFFF;border-radius:50%;display:grid;place-items:center}
.top-title{margin:27px 0 14px;font-size:clamp(1.35rem,4vw,2rem)}.shell{width:min(1160px,94vw);margin:-46px auto 40px}
.panel,.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.panel{padding:20px;margin-bottom:18px}
.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(3,1fr);margin:18px 0}.stat{padding:20px;min-height:120px}
.stat h3{color:var(--muted);font-size:.94rem;font-weight:600;margin:0 0 12px}.amount{font-size:clamp(1.2rem,3.7vw,1.9rem);font-weight:800;direction:ltr;text-align:start}
.income{color:var(--green)}.expense{color:var(--red)}.balance{color:var(--navy)}.two-col{grid-template-columns:1fr 1fr}
h2{font-size:1.2rem;margin:0 0 14px}h3{margin-top:0}.muted{color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.nav-btn,.lang-btn,.mode-btn{border:0;border-radius:11px;padding:10px 14px}
.nav-btn{background:#fff;color:var(--muted);border:1px solid var(--line)}.nav-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.lang-switch{display:flex;gap:5px}.lang-btn{border:1px solid #ffffff66;background:transparent;color:#fff}.lang-btn.active{background:#fff;color:var(--navy)}
.mode-switch{display:flex;gap:4px;background:#E8EEF7;padding:4px;border-radius:13px;max-width:360px}.mode-btn{flex:1;background:transparent;color:var(--muted)}.mode-btn.active{background:var(--navy);color:white}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:700}.btn.primary{background:var(--navy)}.btn.light{background:#EAF4FF;color:var(--navy)}.btn.danger{background:var(--red)}.btn.small{padding:7px 10px;font-size:.86rem}
button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1677C855;outline-offset:2px}
.alert{padding:14px 16px;border-radius:13px;margin:12px 0}.alert.warn{background:#FFF5DF;border:1px solid #F0D495;color:#704600}.alert.danger{background:#FFF0F2;border:1px solid #EDC2C9;color:#8A2433}
.bar-bg{height:11px;background:#E9EEF5;border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px;background:var(--blue);transition:width .2s}.bar.over{background:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin-bottom:12px}label{display:block;font-size:.9rem;font-weight:650;margin-bottom:6px}
input,select{width:100%;min-height:45px;padding:10px 12px;border:1px solid #CCD5E1;border-radius:11px;background:#fff;color:var(--ink)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:610px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:start}th{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;background:#EEF3FA;border-radius:99px;padding:4px 9px;font-size:.82rem}.goal{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.goal h3{margin:0;font-size:1rem}.goal-meta{color:var(--muted);font-size:.9rem;margin:8px 0}.empty{text-align:center;padding:22px;color:var(--muted)}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#D9F1FF,#EFF9FF 55%,#D6EEFF)}
.auth-card{width:min(440px,100%);padding:27px;border-radius:22px;box-shadow:0 18px 50px #082c601f}.auth-brand{justify-content:center;color:var(--navy);margin-bottom:20px}.auth-card input{min-height:48px;background:#FBFDFF}.auth-card .btn{min-height:48px}
.password-wrap{position:relative}.password-wrap input{padding-inline-end:52px}.password-eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#53657B;display:grid;place-items:center}.password-eye:hover{background:#EAF4FF;color:var(--blue)}.password-eye svg{width:22px;height:22px}
.login-language{display:flex;justify-content:center;gap:4px;width:max-content;margin:16px auto 0;padding:4px;border-radius:13px;background:#EDF2F8}.login-language .lang-btn{min-width:110px;color:var(--navy);border:0}.login-language .lang-btn.active{color:white;background:var(--navy)}
.link-btn{border:0;background:transparent;color:var(--blue);text-decoration:underline;padding:8px 0}.footer-note{font-size:.82rem;line-height:1.6;color:var(--muted);margin-top:14px}
.guide{background:#EAF6FF;border:1px solid #BEDFF5;border-radius:12px;padding:12px 14px;margin:12px 0 16px;line-height:1.7;font-size:.9rem}.guide ol{margin:6px 0;padding-inline-start:22px}
.status{min-height:1.4em;color:var(--red);font-size:.9rem;margin:8px 0}.overlay{position:fixed;inset:0;z-index:5;background:#061A35AA;display:grid;place-items:center;padding:16px}.dialog{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:21px}
.recovery-key{direction:ltr;text-align:center;word-break:break-all;background:#EEF4FB;padding:14px;border-radius:11px;font:700 1.15rem monospace}
.donut-layout{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}.donut{width:205px;height:205px;flex:0 0 205px;border-radius:50%;position:relative}.donut-hole{position:absolute;inset:24%;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center;padding:8px}.donut-hole strong{font-size:1.02rem;direction:ltr}.donut-hole small{color:var(--muted)}
.legend{flex:1;min-width:190px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}.legend-name{display:flex;align-items:center;gap:8px}.legend-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
@media(max-width:760px){.stats,.two-col{grid-template-columns:1fr}.stat{min-height:auto}.top{padding:15px 4vw 68px}.panel{padding:16px}}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}.brand{font-size:1.12rem}.brand-mark{width:40px;height:40px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.nav-btn{text-align:center}.auth-card{padding:22px 18px}.login-language{width:100%}.login-language .lang-btn{flex:1}.donut{width:180px;height:180px;flex-basis:180px}}
</style>
</head>
<body>

<section id="loginScreen" class="auth-wrap">
  <div class="panel auth-card">
    <div class="brand auth-brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
    <h2 data-i="loginTitle"></h2><p class="muted" data-i="loginSubtitle"></p>
    <form id="loginForm">
      <div class="field"><label for="loginEmail" data-i="email"></label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field">
        <label for="loginPassword" data-i="password"></label>
        <div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required><button class="password-eye" type="button" data-eye="loginPassword"></button></div>
      </div>
      <button class="btn primary" type="submit" style="width:100%" data-i="login"></button>
    </form>
    <button id="openRecovery" class="link-btn" type="button" data-i="forgot"></button>
    <div class="login-language"><button class="lang-btn" type="button" data-lang="fr">Français</button><button class="lang-btn" type="button" data-lang="ar">عربي</button></div>
    <p class="footer-note" data-i="initialHint"></p>
    <p class="footer-note" data-i="localNotice"></p>
  </div>
</section>

<section id="changeScreen" class="auth-wrap" hidden>
  <div class="panel auth-card">
    <div class="brand auth-brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
    <h2 data-i="changeTitle"></h2><p class="muted" data-i="changeHint"></p>
    <form id="firstChangeForm">
      <div class="field"><label for="firstNewPassword" data-i="newPassword"></label><div class="password-wrap"><input id="firstNewPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-eye="firstNewPassword"></button></div></div>
      <div class="field"><label for="firstConfirmPassword" data-i="confirmPassword"></label><div class="password-wrap"><input id="firstConfirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-eye="firstConfirmPassword"></button></div></div>
      <button class="btn primary" type="submit" style="width:100%" data-i="savePassword"></button>
      <div class="login-language"><button class="lang-btn" type="button" data-lang="fr">Français</button><button class="lang-btn" type="button" data-lang="ar">عربي</button></div>
    </form>
  </div>
</section>

<div id="appScreen" hidden>
  <header class="top">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">↗</span><span>Dinar <b>Smart</b></span></div>
      <div class="actions">
        <div class="lang-switch"><button class="lang-btn" type="button" data-lang="fr">Français</button><button class="lang-btn" type="button" data-lang="ar">عربي</button></div>
        <button id="openChangePassword" class="lang-btn" type="button" data-i="changePassword"></button>
        <button id="logout" class="lang-btn" type="button" data-i="logout"></button>
      </div>
    </div>
    <h1 class="top-title" data-i="dashboardTitle"></h1>
    <div class="mode-switch"><button class="mode-btn active" type="button" data-mode="employee" data-i="employee"></button><button class="mode-btn" type="button" data-mode="artisan" data-i="artisan"></button></div>
  </header>

  <main class="shell">
    <nav class="nav">
      <button class="nav-btn active" data-page="dashboard" data-i="navDashboard"></button>
      <button class="nav-btn" data-page="transactions" data-i="navTransactions"></button>
      <button class="nav-btn" data-page="budget" data-i="navBudget"></button>
      <button class="nav-btn" data-page="goals" data-i="navGoals"></button>
    </nav>

    <section id="page-dashboard">
      <div id="alerts"></div>
      <div class="grid stats">
        <article class="card stat"><h3 data-i="totalIncome"></h3><div id="totalIncome" class="amount income"></div></article>
        <article class="card stat"><h3 data-i="totalExpense"></h3><div id="totalExpense" class="amount expense"></div></article>
        <article class="card stat"><h3 data-i="balance"></h3><div id="balance" class="amount balance"></div><small id="balancePercent" class="muted"></small></article>
      </div>
      <section id="artisanSummary" class="panel" hidden>
        <h2 data-i="artisanSummary"></h2>
        <div class="grid stats">
          <article class="card stat"><h3 data-i="serviceIncome"></h3><div id="serviceIncome" class="amount income"></div></article>
          <article class="card stat"><h3 data-i="professionalExpense"></h3><div id="professionalExpense" class="amount expense"></div></article>
          <article class="card stat"><h3 data-i="estimatedProfit"></h3><div id="profit" class="amount balance"></div></article>
        </div>
      </section>
      <div class="grid two-col">
        <section class="panel">
          <div class="between"><h2 data-i="monthlyBudget"></h2><span id="monthLabel" class="muted"></span></div>
          <div id="budgetSummary"></div><div class="bar-bg"><div id="budgetBar" class="bar" style="width:0%"></div></div>
          <p id="budgetNumbers" class="muted"></p><button class="btn light" data-go="budget" data-i="manageBudget"></button>
        </section>
        <section class="panel"><h2 data-i="expenseByCategory"></h2><div id="donutChart"></div></section>
      </div>
      <section class="panel"><div class="between"><h2 data-i="recentTransactions"></h2><button class="btn small" data-go="transactions" data-i="viewAll"></button></div><div id="recentList"></div></section>
    </section>

    <section id="page-transactions" hidden>
      <section class="panel">
        <div class="between"><h2 data-i="transactionsTitle"></h2><div class="actions"><button id="exportCsv" class="btn light" data-i="exportCsv"></button><button id="addTransaction" class="btn" data-i="addTransaction"></button></div></div>
        <div class="form-grid">
          <div class="field"><label for="filterMonth" data-i="filterMonth"></label><input id="filterMonth" type="month"></div>
          <div class="field"><label for="filterCategory" data-i="category"></label><select id="filterCategory"></select></div>
        </div>
        <div id="transactionList"></div>
      </section>
    </section>

    <section id="page-budget" hidden>
      <section class="panel">
        <h2 data-i="budgetPageTitle"></h2><p class="muted" data-i="budgetHint"></p>
        <form id="budgetForm"><div class="form-grid">
          <div class="field"><label for="budgetMonth" data-i="month"></label><input id="budgetMonth" type="month" required></div>
          <div class="field"><label for="budgetAmount" data-i="budgetAmount"></label><input id="budgetAmount" type="number" min="0" step=".01" required></div>
        </div><button class="btn primary" type="submit" data-i="saveBudget"></button></form>
        <div id="budgetDetail" style="margin-top:20px"></div>
      </section>
    </section>

    <section id="page-goals" hidden>
      <section class="panel">
        <h2 data-i="goalsTitle"></h2>
        <form id="goalForm"><div class="form-grid">
          <div class="field"><label for="goalName" data-i="goalName"></label><input id="goalName" maxlength="60" required></div>
          <div class="field"><label for="goalTarget" data-i="goalTarget"></label><input id="goalTarget" type="number" min=".01" step=".01" required></div>
          <div class="field"><label for="goalSaved" data-i="goalSaved"></label><input id="goalSaved" type="number" min="0" step=".01" value="0"></div>
        </div><button class="btn primary" type="submit" data-i="addGoal"></button></form>
        <div id="goalList" style="margin-top:20px"></div>
      </section>
    </section>
  </main>
</div>

<div id="transactionDialog" class="overlay" hidden>
  <div class="dialog">
    <div class="between"><h2 id="transactionDialogTitle" data-i="addTransaction"></h2><button class="btn light small" data-close="transactionDialog" data-i="close"></button></div>
    <form id="transactionForm">
      <input id="transactionId" type="hidden"><input id="transactionMode" type="hidden">
      <div class="form-grid">
        <div class="field"><label for="txType" data-i="type"></label><select id="txType"><option value="income" data-i="income"></option><option value="expense" data-i="expense"></option></select></div>
        <div class="field"><label for="txAmount" data-i="amount"></label><input id="txAmount" type="number" min=".01" step=".01" required></div>
        <div class="field"><label for="txCategory" data-i="category"></label><select id="txCategory" required></select></div>
        <div class="field"><label for="txDate" data-i="date"></label><input id="txDate" type="date" required></div>
      </div>
      <div class="field"><label for="txNote" data-i="description"></label><input id="txNote" maxlength="120"></div>
      <button class="btn primary" type="submit" data-i="save"></button>
    </form>
  </div>
</div>

<!-- استعادة كلمة المرور عند الخروج: تحتاج رمز الاستعادة الذي حفظته -->
<div id="recoveryDialog" class="overlay" hidden>
  <div class="dialog">
    <div class="between"><h2 data-i="forgot"></h2><button class="btn light small" data-close="recoveryDialog" data-i="close"></button></div>
    <div class="guide">
      <strong data-i="recoveryGuideTitle"></strong>
      <ol><li data-i="recoveryStep1"></li><li data-i="recoveryStep2"></li><li data-i="recoveryStep3"></li></ol>
    </div>
    <form id="recoveryForm" autocomplete="off">
      <div class="field"><label for="recoveryEmail" data-i="email"></label><input id="recoveryEmail" type="email" autocomplete="off" required></div>
      <div class="field"><label for="recoveryKey" data-i="recoveryKey"></label><input id="recoveryKey" autocomplete="off" autocapitalize="characters" required><small class="muted" data-i="recoveryKeyHelp"></small></div>
      <div class="field"><label for="recoveryNewPassword" data-i="newPassword"></label><div class="password-wrap"><input id="recoveryNewPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-eye="recoveryNewPassword"></button></div></div>
      <div class="field"><label for="recoveryConfirmPassword" data-i="confirmPassword"></label><div class="password-wrap"><input id="recoveryConfirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-eye="recoveryConfirmPassword"></button></div></div>
      <p id="recoveryStatus" class="status" role="status" aria-live="polite"></p>
      <button class="btn primary" type="submit" style="width:100%" data-i="resetPassword"></button>
      <div class="login-language"><button class="lang-btn" type="button" data-lang="fr">Français</button><button class="lang-btn" type="button" data-lang="ar">عربي</button></div>
    </form>
  </div>
</div>

<!-- تغيير كلمة المرور من داخل الحساب: يدخل كلمة المرور الحالية -->
<div id="changePasswordDialog" class="overlay" hidden>
  <div class="dialog">
    <div class="between"><h2 data-i="changePassword"></h2><button class="btn light small" data-close="changePasswordDialog" data-i="close"></button></div>
    <div class="guide" data-i="changePasswordHint"></div>
    <form id="changePasswordForm" autocomplete="off">
      <div class="field"><label for="currentPassword" data-i="currentPassword"></label><div class="password-wrap"><input id="currentPassword" type="password" autocomplete="current-password" required><button class="password-eye" type="button" data-eye="currentPassword"></button></div></div>
      <div class="field"><label for="changeNewPassword" data-i="newPassword"></label><div class="password-wrap"><input id="changeNewPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-eye="changeNewPassword"></button></div></div>
      <div class="field"><label for="changeConfirmPassword" data-i="confirmPassword"></label><div class="password-wrap"><input id="changeConfirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-eye="changeConfirmPassword"></button></div></div>
      <p id="changeStatus" class="status" role="status" aria-live="polite"></p>
      <button class="btn primary" type="submit" style="width:100%" data-i="savePassword"></button>
    </form>
  </div>
</div>

<div id="keyDialog" class="overlay" hidden>
  <div class="dialog" style="text-align:center">
    <h2 data-i="saveRecoveryKey"></h2><p class="muted" data-i="keyOneTime"></p>
    <div id="shownKey" class="recovery-key"></div>
    <button id="copyKey" class="btn light" style="margin:12px" data-i="copyKey"></button>
    <button id="closeKeyDialog" class="btn primary" data-i="understood"></button>
  </div>
</div>

<script>

function randomHex(n=16){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function hashPassword(password,saltHex){
 if(!crypto?.subtle)throw Error("CRYPTO");
 const salt=Uint8Array.from(saltHex.match(/.{1,2}/g).map(x=>parseInt(x,16)));
 const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},key,256);
 return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function initAccount(){
 account=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"null");
 if(!account){const salt=randomHex();account={email:ADMIN_EMAIL,salt,hash:await hashPassword(INITIAL_PASSWORD,salt),mustChange:true,recoverySalt:"",recoveryHash:""};saveAccount()}
 $("#loginEmail").value=account.email;
}

async function changePassword(password){
 const salt=randomHex(),recovery=randomHex(12).toUpperCase().match(/.{1,4}/g).join("-"),recoverySalt=randomHex();
 account.salt=salt;account.hash=await hashPassword(password,salt);account.mustChange=false;
 account.recoverySalt=recoverySalt;account.recoveryHash=await hashPassword(recovery,recoverySalt);saveAccount();
 return recovery;
}

}

 if([...el.options].some(o=>o.value===old))el.value=old;
}

function monthTx(m){return data.transactions.filter(x=>(x.date||"").slice(0,7)===m)}

function render(){

 const income=sum(data.transactions,"income"),expense=sum(data.transactions,"expense"),month=thisMonth();
 $("#totalIncome").textContent=money(income);$("#totalExpense").textContent=money(expense);$("#balance").textContent=money(income-expense);
 $("#balancePercent").textContent=income?`${Math.max(0,Math.round((income-expense)/income*100))}% ${t("remaining")}`:"";
 $("#monthLabel").textContent=new Intl.DateTimeFormat(lang==="ar"?"ar-TN":"fr-TN",{month:"long",year:"numeric"}).format(new Date(month+"-01T12:00:00"));
 const budget=Number(data.budgets[month]||0),spent=sum(monthTx(month),"expense"),pct=budget?spent/budget*100:0;
 $("#budgetBar").style.width=Math.min(100,pct)+"%";$("#budgetBar").classList.toggle("over",spent>budget);
 $("#budgetNumbers").textContent=budget?`${t("usedLabel")}: ${money(spent)} / ${money(budget)} (${Math.round(pct)}%)`:t("noBudgetYet");

function renderDonut(month){
 const grouped={};monthTx(month).filter(x=>x.type==="expense").forEach(x=>grouped[x.category]=(grouped[x.category]||0)+Number(x.amount||0));
 const entries=Object.entries(grouped).sort((a,b)=>b[1]-a[1]),all=entries.reduce((s,x)=>s+x[1],0);
 if(!all){$("#donutChart").innerHTML=`<div class="empty">${esc(t("chartNoData"))}</div>`;return}
 let deg=0;const segments=entries.map(([c,v],i)=>{const start=deg;deg+=v/all*360;return `${chartColors[i%chartColors.length]} ${start}deg ${deg}deg`});
 const legend=entries.map(([c,v],i)=>`<div class="legend-row"><span class="legend-name"><i class="legend-dot" style="background:${chartColors[i%chartColors.length]}"></i>${esc(categoryLabel(c))}</span><span>${esc(money(v))} · ${Math.round(v/all*100)}%</span></div>`).join("");
 $("#donutChart").innerHTML=`<p class="muted">${esc(t("chartMonth"))}: ${esc($("#monthLabel").textContent)}</p><div class="donut-layout"><div class="donut" role="img" aria-label="${esc(t("expenseByCategory"))}" style="background:conic-gradient(${segments.join(",")})"><div class="donut-hole"><small>${esc(t("chartTotal"))}</small><strong>${esc(money(all))}</strong></div></div><div class="legend">${legend}</div></div>`;
}

}

 $("#transactionForm").reset();$("#transactionId").value=x?.id||"";$("#transactionMode").value=x?.mode||mode;
 $("#txType").value=x?.type||"expense";$("#txAmount").value=x?.amount||"";$("#txDate").value=x?.date||today();$("#txNote").value=x&&!x.sample?x.description||"":"";
 $("#transactionDialogTitle").textContent=x?t("edit"):t("addTransaction");updateTxCategories();if(x)$("#txCategory").value=x.category;openDialog("transactionDialog");
}
function startApp(){loadData();$("#filterMonth").value=thisMonth();$("#budgetMonth").value=thisMonth();showScreen("appScreen");render()}
function exportCsv(){
 const rows=[[t("date"),t("type"),t("category"),t("description"),t("amount"),"TND"]];
 [...data.transactions].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(x=>rows.push([x.date,t(x.type),categoryLabel(x.category),desc(x),Number(x.amount).toFixed(2),"TND"]));
 const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`dinar-smart-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);
}

document.addEventListener("click",async e=>{
 const lb=e.target.closest("[data-lang]");if(lb)setLanguage(lb.dataset.lang);
 const eye=e.target.closest("[data-eye]");if(eye){const input=$(eye.dataset.eye);input.type=input.type==="password"?"text":"password";syncEyes()}
 const mb=e.target.closest("[data-mode]");if(mb){mode=mb.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===mb));render()}
 const page=e.target.closest("[data-page]");if(page)setPage(page.dataset.page);
 const go=e.target.closest("[data-go]");if(go)setPage(go.dataset.go);
 const close=e.target.closest("[data-close]");if(close)closeDialog(close.dataset.close);
 const edit=e.target.closest("[data-edit]");if(edit)openTransaction(data.transactions.find(x=>x.id===edit.dataset.edit));
 const del=e.target.closest("[data-delete-tx]");if(del&&confirm(t("confirmDelete"))){data.transactions=data.transactions.filter(x=>x.id!==del.dataset.deleteTx);saveData();render()}
 const dg=e.target.closest("[data-delete-goal]");if(dg&&confirm(t("confirmGoalDelete"))){data.goals=data.goals.filter(x=>x.id!==dg.dataset.deleteGoal);saveData();render()}
 const add=e.target.closest("[data-contribute]");if(add){const g=data.goals.find(x=>x.id===add.dataset.contribute),amount=Number($("contrib-"+add.dataset.contribute).value);if(g&&amount>0){g.saved=Number(g.saved||0)+amount;saveData();render()}}
});

$("#loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 try{
  if($("#loginEmail").value.trim().toLowerCase()!==account.email.toLowerCase())return alert(t("emailMismatch"));
  if(await hashPassword($("#loginPassword").value,account.salt)!==account.hash)return alert(t("invalidLogin"));
  if(account.mustChange)showScreen("changeScreen");else startApp();
 }catch{alert(t("cryptoError"))}
});

$("#firstChangeForm").addEventListener("submit",async e=>{
 e.preventDefault();const p=$("#firstNewPassword").value;
 if(p.length<8)return alert(t("minPassword"));
 if(p!==$("#firstConfirmPassword").value)return alert(t("passwordsMismatch"));
 try{const code=await changePassword(p);$("#firstChangeForm").reset();showKey(code)}
 catch{alert(t("cryptoError"))}
});

$("#openRecovery").addEventListener("click",()=>{clearRecoveryForm();openDialog("recoveryDialog")});
$("#recoveryForm").addEventListener("submit",async e=>{
 e.preventDefault();const status=$("#recoveryStatus"),say=k=>status.textContent=t(k);
 const email=$("#recoveryEmail").value.trim().toLowerCase(),code=$("#recoveryKey").value.trim().toUpperCase();
 const p=$("#recoveryNewPassword").value,confirmP=$("#recoveryConfirmPassword").value;
 if(!email||!code||!p||!confirmP){say("recoveryEmpty");return}
 if(email!==account.email.toLowerCase()){say("recoveryEmailBad");return}
 if(p.length<8){say("recoveryShort");return}
 if(p!==confirmP){say("recoveryMismatch");return}
 try{
  let valid=false;
  if(account.recoveryHash&&account.recoverySalt)valid=await hashPassword(code,account.recoverySalt)===account.recoveryHash;
  else if(account.mustChange)valid=await hashPassword(code,account.salt)===account.hash;
  if(!valid){say("resetFailed");return}
  const newCode=await changePassword(p);
  clearRecoveryForm();closeDialog("recoveryDialog");showKey(newCode);
 }catch{say("cryptoError")}
});

$("#openChangePassword").addEventListener("click",()=>{clearChangeForm();openDialog("changePasswordDialog")});
$("#changePasswordForm").addEventListener("submit",async e=>{
 e.preventDefault();const status=$("#changeStatus"),say=k=>status.textContent=t(k);
 const current=$("#currentPassword").value,p=$("#changeNewPassword").value,confirmation=$("#changeConfirmPassword").value;
 if(p.length<8){say("minPassword");return}
 if(p!==confirmation){say("passwordsMismatch");return}
 try{
  if(await hashPassword(current,account.salt)!==account.hash){say("wrongCurrentPassword");return}
  const code=await changePassword(p);
  clearChangeForm();closeDialog("changePasswordDialog");showKey(code);
 }catch{say("cryptoError")}
});

$("#closeKeyDialog").addEventListener("click",()=>{closeDialog("keyDialog");if(account.mustChange)startApp()});
$("#copyKey").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("#shownKey").textContent);$("#copyKey").textContent=lang==="ar"?"تم النسخ":"Copié"}catch{prompt(t("copyKey"),$("#shownKey").textContent)}});
$("#logout").addEventListener("click",()=>{$("#loginPassword").value="";showScreen("loginScreen")});
$("#addTransaction").addEventListener("click",()=>openTransaction(null));
$("#txType").addEventListener("change",updateTxCategories);
$("#filterMonth").addEventListener("change",renderTransactions);
$("#filterCategory").addEventListener("change",renderTransactions);
$("#exportCsv").addEventListener("click",exportCsv);

$("#transactionForm").addEventListener("submit",e=>{
 e.preventDefault();const amount=Number($("#txAmount").value);if(!(amount>0))return alert(t("invalidAmount"));
 const id=$("#transactionId").value||newId();
 const tx={id,type:$("#txType").value,amount,category:$("#txCategory").value,date:$("#txDate").value,description:$("#txNote").value.trim(),mode:$("#transactionMode").value||mode};
 const i=data.transactions.findIndex(x=>x.id===id);if(i<0)data.transactions.push(tx);else data.transactions[i]=tx;
 saveData();closeDialog("transactionDialog");render();
});
$("#budgetForm").addEventListener("submit",e=>{e.preventDefault();const m=$("#budgetMonth").value,n=Number($("#budgetAmount").value);if(m&&n>=0){data.budgets[m]=n;saveData();render()}});
$("#budgetMonth").addEventListener("change",renderBudget);
$("#goalForm").addEventListener("submit",e=>{
 e.preventDefault();const target=Number($("#goalTarget").value),saved=Number($("#goalSaved").value||0);
 if(!(target>0)||saved<0)return alert(t("invalidAmount"));
 data.goals.push({id:newId(),name:$("#goalName").value.trim(),target,saved});saveData();$("#goalForm").reset();$("#goalSaved").value="0";render();
});

fillCategories($("#filterCategory"),true);
$("#filterMonth").value=thisMonth();$("#budgetMonth").value=thisMonth();
translate();
initAccount().catch(()=>alert(t("cryptoError")));
</script>
</body>
</html>
